    <h1>init(name:id:idAliases:linkDisambiguationID:)</h1>
    <p>Creates a new language with a given name and identifier.</p>
    <pre>
        <code>init(name: String, id: String, idAliases: [String] = [], linkDisambiguationID: String? = nil)</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>name</dt>
    <dd>
        <p>The display name of the programming language.</p>
    </dd>
    <dt>id</dt>
    <dd>
        <p>A globally unique identifier for the language.</p>
    </dd>
    <dt>idAliases</dt>
