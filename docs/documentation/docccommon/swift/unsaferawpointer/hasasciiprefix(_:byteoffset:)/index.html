    <p>Instance Method</p>
    <h1>hasASCIIPrefix(_:byteOffset:)</h1>
    <p>Checks if the raw pointer has the given ASCII prefix at the given byte offset.</p>
    <pre>
        <code>func hasASCIIPrefix(_ prefix: StaticString, byteOffset: Int = 0) -&gt; Bool</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>prefix</dt>
    <dd>
        <p>The ASCII prefix to check if the raw pointer starts with.</p>
    </dd>
    <dt>byteOffset</dt>
    <dd>
        <p>The byte offset from where the raw pointer checks for the given prefix.</p>
    </dd>
</dl>
<h2>Return Value</h2>
<p><code>true</code>
     if the raw pointer has the given ASCII prefix at the given byte offset; <code>false</code>
     otherwise.</p>
