    <p>Instance Method</p>
    <h1>advanceToNextKey()</h1>
    <p>Advances the decoder to just beyond the opening string delimiter of the next key.</p>
    <pre>
        <code>mutating func advanceToNextKey() throws(DecodingError) -&gt; Bool</code>
    </pre>
</section>
<h2>Return Value</h2>
<p><code>true</code>
     if the decoder found another key, <code>false</code>
     if the decoder found the end of the current JSON object—a closing curly brace (<code>}</code>
    ).</p>
<h2>Discussion</h2>
<p>If the decoder returns <code>true</code>
    , the decoder is in a state where your <code>FastJSONDecodable</code>
     conformance can call <a href="../matchkey(_:byteoffset:)/index.html">
        <code>matchKey(_:byteOffset:)</code>
    </a>
     to check which key the decoder encountered in the JSON data. If the decoder returns <code>false</code>
    , the decoder found the last key for this JSON object. In this case the decoder will advance past the closing curly brace (<code>}</code>
    ) that marks the end of this JSON object.</p>
