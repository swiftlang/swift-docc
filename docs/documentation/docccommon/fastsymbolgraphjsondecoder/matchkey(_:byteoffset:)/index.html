    <p>Instance Method</p>
    <h1>matchKey(_:byteOffset:)</h1>
    <p>Checks if the decoder is currently pointing to a specific JSON key.</p>
    <pre>
        <code>mutating func matchKey(_ jsonKey: StaticString, byteOffset: Int = 0) -&gt; Bool</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>jsonKey</dt>
    <dd>
        <p>The json key that the decoder checks for</p>
    </dd>
    <dt>byteOffset</dt>
    <dd>
        <p>The byte offset from the decoder’s current state where the decoder checks for the key.</p>
    </dd>
</dl>
<h2>Return Value</h2>
<p><code>true</code>
     if the decoder matched this key, <code>false</code>
     otherwise.</p>
<h2>Discussion</h2>
<p>If the decoder’s current state matches the given key, the decoder advances past the key and its value separator (<code>:</code>
    ) so that the decoder is in a state where it can decode the value for that key.</p>
<h2>Performance considerations</h2>
<p>If the key you’re checking for is only 3 bytes or only 7 bytes, it’s faster to include the trailing string delimiter (<code>"</code>
    ) in the key so that it fully fills a 4 byte value or 8 byte value.</p>
<p>If the key you’re checking for is only 6 bytes, it’s faster to include both the leading and trailing string delimiters (<code>"</code>
    ) in the key so that it fully fills a 8 byte value. To include the <i>leading</i>
     string delimiter you’ll need to specify a <code>-1</code>
     byte offset, because the decoder will have already advanced just past the leading string delimiter after calling <code>advanceToNextKey</code>
    .</p>
