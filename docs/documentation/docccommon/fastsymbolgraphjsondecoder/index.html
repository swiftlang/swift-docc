    <h1>FastSymbolGraphJSONDecoder</h1>
    <p>A custom JSON decoder for symbol graph files that focuses on performance and memory usage.</p>
    <pre>
        <code>struct FastSymbolGraphJSONDecoder</code>
    </pre>
</section>
<h2>Overview</h2>
<p>The decoder is designed around a single linear scan through the bytes of the JSON data in order to minimize unnecessary work. This means that elements needs to be decoded in the order the they appear in the JSON data and that to ignore unknown elements in the JSON data, the decoder still needs to parse them to know where that ignored element ends.</p>
<p>The decoder also requires that all keys are static strings known at compile time, and compares their underlying raw bytes. This makes it unsuitable as a general purpose JSON decoder for arbitrary that needs to decode arbitrary structures, but it’s not an issue for decoding symbol graph data (or even other known structured that are known to use all ASCII keys that don’t require normalization).</p>
