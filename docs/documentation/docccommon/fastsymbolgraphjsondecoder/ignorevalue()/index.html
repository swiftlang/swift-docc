    <hgroup>
      <p>Instance Method</p>
      <h1>ignoreValue()</h1>
    </hgroup>
    <p>Scans past the current value (regardless of its type) and advances the decoder’s state so that it can decode the next value.</p>
    <pre><code>mutating func ignoreValue() throws(DecodingError)</code></pre>
  </section>
  <h2>Discussion</h2>
  <p>
    If your <code>FastJSONDecodable</code> conformance encounters a key that it doesn’t recognize, your implementation has to call <code>ignoreValue()</code>. Otherwise, the decoder’s state won’t advance past the unknown value and any following call to <code>advanceToNextKey()</code> will raise a <code>DecodingError</code>.
  </p>
