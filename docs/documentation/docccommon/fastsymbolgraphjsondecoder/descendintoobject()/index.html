    <hgroup>
      <p>Instance Method</p>
      <h1>descendIntoObject()</h1>
    </hgroup>
    <p>
      Advances the decoder past the opening curly brace (<code>{</code>) and prepares it to decode a series of values using <code>advanceToNextKey()</code>.
    </p>
    <pre><code>mutating func descendIntoObject() throws(DecodingError)</code></pre>
  </section>
  <h2>Discussion</h2>
  <p>
    If your <code>FastJSONDecodable</code> conformance don’t call this method before attempting to decode the first key, the decoder will be in an incorrect state and will fail to parse the key, resulting in a <code>DecodingError</code>.
  </p>
