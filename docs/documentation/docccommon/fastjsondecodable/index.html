    <p>Protocol</p>
    <h1>FastJSONDecodable</h1>
    <p>A protocol for types that can be decoded using a <code>FastSymbolGraphJSONDecoder</code>
        .</p>
    <pre>
        <code>protocol FastJSONDecodable</code>
    </pre>
</section>
<h2>Overview</h2>
<p>The only “primitive” types that can be decoded are <code>Int</code>
    , <code>String</code>
    , and <code>Bool</code>
     and array values and optional values of those primitive types. Any other type needs its own decoding implementation.</p>
<p>If the decodable type is an “object”—meaning that it decodes individual properties for different string keys—its decoding implementation happens in 3 steps:</p>
<ul>
    <li>
        <p>Declare local optional variables for each property that needs to be decoded</p>
    </li>
    <li>
        <p>Advance the decoder and decode each value in the order that the keys appear in the data</p>
    </li>
    <li>
        <p>Verify that all required properties were decoded.</p>
    </li>
</ul>
<p>For example, a type with a “first” <code>String</code>
     property and a “second” <code>Int</code>
     property that defaults to 0 can be implement its decoding like this:</p>
<pre>
    <code>// Declare local variables for the properties that needs to be decoded
var first: String?  // This needs to be optional to represent that it hasn't been decoded yet.
var second: Int = 0 // This doesn't need to be optional because it has a default value.

// Decode each property in the order they appear in the data
try decoder.descendIntoObject()
while try decoder.advanceToNextKey() {
    if decoder.matchKey("first") {
        first = try decoder.decode(String.self)
    }
    else if decoder.matchKey("second") {
        second = try decoder.decode(Int.self)
    }
    // Do nothing for any unknown keys that the decoder might encounter
    else {
        // Your implementation explicitly needs to ignore this value so that the decoder can advance to the next key.
        try decoder.ignoreValue()
    }
}

// Verify that the property without a default value was decoded
guard let first else {
    throw .keyNotFound(...)
}

self.init(...)
</code>
</pre>
<p>If the decodable type is <code>RawRepresentable</code>
     it can decode its raw value and initialize itself like this:</p>
<pre>
    <code>let rawValue = try decoder.decode(RawValue.self)
self = .init(rawValue: consume rawValue)
</code>
</pre>
