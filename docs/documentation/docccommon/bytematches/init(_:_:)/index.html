    <hgroup>
      <p>Initializer</p>
      <h1>init(_:_:)</h1>
    </hgroup>
    <p>Creates a new byte match result to find the first byte that matches the given search pattern.</p>
    <pre><code>init(_ bytes: UInt64, _ searchPattern: UInt64)</code></pre>
  </section>
  <h2>Parameters</h2>
  <dl>
    <dt>bytes</dt>
    <dd>
      <p>The 8 consecutive bytes of data to match against the search pattern.</p>
    </dd>
    <dt>searchPattern</dt>
    <dd>
      <p>The byte to search for, repeated 8 times.</p>
    </dd>
  </dl>
