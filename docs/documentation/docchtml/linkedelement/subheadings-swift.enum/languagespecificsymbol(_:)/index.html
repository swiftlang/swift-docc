    <p>Case</p>
    <h1>LinkedElement.Subheadings.languageSpecificSymbol(_:)</h1>
    <p>This element is a symbol with different names in different languages.</p>
    <pre>
        <code>case languageSpecificSymbol([SourceLanguage : [SymbolNameFragment]])</code>
    </pre>
</section>
<h2>Discussion</h2>
<p>Because <code>@DisplayName</code>
     applies to all language representations, these language specific names are always the symbol’s subheading declaration and should display in a monospaced font.</p>
