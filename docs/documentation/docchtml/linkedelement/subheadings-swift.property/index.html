    <p>Instance Property</p>
    <h1>subheadings</h1>
    <p>The subheadings of the linked element, for display when the element is referenced in either a Topics section, See Also section, or in a <code>@Links</code>
         directive.</p>
    <pre>
        <code>var subheadings: Subheadings</code>
    </pre>
</section>
<h2>Discussion</h2>
<p>Articles, headings, tutorials, and similar pages have a <code>conceptual(_:)</code>
     name. Symbols can either have a <code>symbol(_:)</code>
     name or have different names for each language representation (<code>languageSpecificSymbol</code>
    ).</p>
