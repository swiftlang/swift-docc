    <p>Type Method</p>
    <h1>lang(_:)</h1>
    <p>The language that a non-editable element is in, or the language that an editable element should be written in by the user.</p>
    <pre>
        <code>static func lang(_ value: String) -&gt; Attribute</code>
    </pre>
</section>
<h2>Discussion</h2>
<p>A compliant HTTP page should only specify a valid <a href="https://en.wikipedia.org/wiki/IETF_language_tag">BCP 47 language tag</a>
     as the value for this attribute.</p>
