  <ul>
    <li>
      <p>
        the type of control to display for an <code>&lt;input></code> element (“button”, “checkbox”, “color”, “date”, “email”, “file”, “image”, “month”, “number”, “password”, “radio”, “range”, etc.)

      </p>
    </li>
    <li>
      <p>
        the type of script that a <code>&lt;script></code> element represents
      </p>
    </li>
    <li>
      <p>
        the MIME type that a <code>&lt;link></code> element is referencing.
      </p>
    </li>

      </p>
