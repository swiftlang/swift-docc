    <p>Type Method</p>
    <h1>type(_:)</h1>
    <p>Depending on the element, either:</p>
    <pre>
        <code>static func type(_ value: String) -&gt; Attribute</code>
    </pre>
</section>
<h2>Discussion</h2>
<ul>
    <li>
        <p>the type of control to display for an <code>&lt;input&gt;</code>
             element (“button”, “checkbox”, “color”, “date”, “email”, “file”, “image”, “month”, “number”, “password”, “radio”, “range”, etc.)</p>
    </li>
    <li>
        <p>the behavior for a <code>&lt;button&gt;</code>
             element (“submit”, “reset”, or “button”)</p>
    </li>
    <li>
        <p>the numbering type for an <code>&lt;ol&gt;</code>
             element (“a”, “A”, “i” , “I” , or “1”)</p>
    </li>
    <li>
        <p>the type of script that a <code>&lt;script&gt;</code>
             element represents</p>
    </li>
    <li>
        <p>the MIME type that a <code>&lt;link&gt;</code>
             element is referencing.</p>
    </li>
    <li>
        <p>the MIME type of the media that a <code>&lt;source&gt;</code>
             element is referencing.</p>
    </li>
</ul>
