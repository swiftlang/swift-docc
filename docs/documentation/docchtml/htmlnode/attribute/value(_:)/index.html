    <p>Type Method</p>
    <h1>value(_:)</h1>
    <p>Depending on the element, either:</p>
    <pre>
        <code>static func value(_ value: String) -&gt; Attribute</code>
    </pre>
</section>
<h2>Discussion</h2>
<ul>
    <li>
        <p>The value of an <code>&lt;input&gt;</code>
             element.</p>
    </li>
    <li>
        <p>The ordinal value of a <code>&lt;li&gt;</code>
             element within a <code>&lt;ol&gt;</code>
             element.</p>
    </li>
    <li>
        <p>The machine-readable representation of a <code>&lt;data&gt;</code>
             element’s content.</p>
    </li>
    <li>
        <p>The numeric value of a <code>&lt;meter&gt;</code>
             or <code>&lt;progress&gt;</code>
             element.</p>
    </li>
    <li>
        <p>The value that is associated with a <code>&lt;button&gt;</code>
             element’s <a href="../name(_:)/index.html">
                <code>name(_:)</code>
            </a>
             when its containing form is submitted.</p>
    </li>
</ul>
