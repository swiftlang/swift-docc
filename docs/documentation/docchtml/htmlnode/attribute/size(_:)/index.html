    <p>Type Method</p>
    <h1>size(_:)</h1>
    <p>The width of the <code>&lt;input&gt;</code>
         or <code>&lt;select&gt;</code>
         element.</p>
    <pre>
        <code>static func size(_ width: Int) -&gt; Attribute</code>
    </pre>
</section>
<h2>Discussion</h2>
<p>If the element’s <a href="../type(_:)/index.html">
        <code>type(_:)</code>
    </a>
     attribute is “text” or “password”, the value is measured in number of characters. Otherwise, the value is measured in pixels.</p>
