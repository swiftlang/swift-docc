    <hgroup>
      <p>Type Method</p>
      <h1>cssCustomProperties(_:)</h1>
    </hgroup>
    <p>
      An inline <code>style</code> attribute that only defines CSS custom properties for the style sheet to use.
    </p>
    <pre><code>static func cssCustomProperties(_ properties: KeyValuePairs&lt;String, String>) -> Attribute</code></pre>
  </section>
  <h2>Parameters</h2>
  <dl>
    <dt>properties</dt>
    <dd>
      <p>
        The names, without the <code>--</code> prefix, and values of the CSS custom properties. Each name must be non-empty and only contain lowercase ASCII letters, digits, <code>-</code>, or <code>_</code>.
      </p>
    </dd>
  </dl>
  <h2>Discussion</h2>
  <p>Use this to pass per-element values—like an item’s position or the number of items—to rules in the style sheet.</p>
