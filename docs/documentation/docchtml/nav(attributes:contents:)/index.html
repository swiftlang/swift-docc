    <p>Function</p>
    <h1>nav(attributes:contents:)</h1>
    <p>Creates a new <code>&lt;nav&gt;</code>
         element with the given attributes and contents.</p>
    <pre>
        <code>func nav(attributes: [HTMLNode.Attribute] = [], contents: [HTMLNode]) -&gt; HTMLNode</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>attributes</dt>
    <dd>
        <p>The list of attributes for the new element.</p>
    </dd>
    <dt>contents</dt>
    <dd>
        <p>The inner contents for the new element.</p>
    </dd>
</dl>
<h2>Return Value</h2>
<p>A new <code>&lt;nav&gt;</code>
     element.</p>
<h2>Discussion</h2>
<p>The <code>&lt;nav&gt;</code>
     element semantically represents section of a page that links to other pages or to parts within the page.</p>
