    <hgroup>
      <p>Instance Method</p>
      <h1>groupedSection(named:groups:)</h1>
    </hgroup>
    <p>Creates a grouped section with a given name, for example “topics” or “see also” that describes and organizes groups of related API.</p>
    <pre><code>func groupedSection(named sectionName: String, groups taskGroups: [SourceLanguage : [TaskGroupInfo]]) -> [HTMLNode]</code></pre>
  </section>
  <h2>Discussion</h2>
  <p>If each language representation of the API has its own task groups, pass the task groups for each language representation.</p>
  <p>
    If the API has the <i>same</i> task groups in all language representations, only pass the task groups for one language. This produces a named section that doesn’t hide any task groups for any of the languages (the same as if the symbol only had one language representation).
  </p>
