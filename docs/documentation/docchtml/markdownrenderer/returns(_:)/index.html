    <hgroup>
      <p>Instance Method</p>
      <h1>returns(_:)</h1>
    </hgroup>
    <p>Creates a “returns” section that describes all return values of a symbol.</p>
    <pre><code>func returns(_ languageSpecificSections: [SourceLanguage : [any Markup]]) -> [HTMLNode]</code></pre>
  </section>
  <h2>Discussion</h2>
  <p>If each language representation of the symbol has its own language-specific return values, pass the return value content for all language representations.</p>
  <p>
    If all language representations of the symbol have the <i>same</i> return value, only pass the return value content for one language. This produces a “returns” section that doesn’t hide the return value content for any of the languages (same as if the symbol only had one language representation)
  </p>
