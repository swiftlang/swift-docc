    <h1>MarkdownRenderer</h1>
    <p>An HTML renderer for DocC markdown content.</p>
    <pre>
        <code>struct MarkdownRenderer&lt;Provider&gt; where Provider : LinkProvider</code>
    </pre>
</section>
<h2>Overview</h2>
<p>Markdown elements that have different meaning depending on where they occur in the page structure (for example links in prose vs. links in topic sections) should be handled at a layer above this plain markdown renderer.</p>
