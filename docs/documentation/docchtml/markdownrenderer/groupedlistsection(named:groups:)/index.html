    <hgroup>
      <p>Instance Method</p>
      <h1>groupedListSection(named:groups:)</h1>
    </hgroup>
    <p>Creates a grouped section with a given name, for example “relationships” or “mentioned in” lists groups of related pages without further description.</p>
    <pre><code>func groupedListSection(named sectionName: String, groups lists: [SourceLanguage : [ListInfo]]) -> [HTMLNode]</code></pre>
  </section>
  <h2>Discussion</h2>
  <p>If each language representation of the API has its own lists, pass the list for each language representation.</p>
  <p>
    If the API has the <i>same</i> lists in all language representations, only pass the lists for one language. This produces a named section that doesn’t hide any lists for any of the languages (the same as if the symbol only had one language representation).
  </p>
