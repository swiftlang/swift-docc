      <h1>declaration(_:)</h1>

    <p>
      Creates a<code>&lt;pre>&lt;code></code> HTML element hierarchy that represents the symbol’s language-specific declarations.
    </p>
    <pre><code>func declaration(_ fragmentsByLanguage: [SourceLanguage : [DeclarationFragment]]) -> HTMLNode</code></pre>
  </section>
  <h2>Discussion</h2>
  <p>
    When the renderer has a 
    <a href="../../rendergoal/richness/index.html">
      <code>RenderGoal.richness</code>
    </a>
     goal, it creates a <code>&lt;span></code> element for each declaration fragment to enable syntax highlighting.
  </p>
  <p>
    When the renderer has a 
    <a href="../../rendergoal/conciseness/index.html">
      <code>RenderGoal.conciseness</code>
    </a>
     goal, it joins the different fragments into string.
  </p>
