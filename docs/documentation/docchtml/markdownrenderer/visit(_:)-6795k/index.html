    <p>Instance Method</p>
    <h1>visit(_:)</h1>
    <p>Transforms a markdown heading into a<code>&lt;h[1...6]&gt;</code>
         HTML element whose content is wrapped in an <code>&lt;a&gt;</code>
         HTML element that references the heading itself.</p>
    <pre>
        <code>func visit(_ heading: Heading) -&gt; HTMLNode</code>
    </pre>
</section>
<h2>Discussion</h2>
<p>As part of transforming the heading, the renderer also transforms all of the its content recursively. For example, the renderer transforms this markdown</p>
<pre class="md">
    <code># Some _Formatted_ text
</code>
</pre>
<p>into XML nodes representing this HTML structure</p>
<pre>
    <code>&lt;h1 id="some-formatted-text"&gt;
  &lt;a href="#some-formatted-text"&gt;
    Some &lt;i&gt;formatted&lt;/i&gt;text
  &lt;/a&gt;
&lt;/h1&gt;
</code>
</pre>
<blockquote class="aside note">
    <p class="label">Note</p>
    <p>When the renderer has a <a href="../../rendergoal/conciseness/index.html">
            <code>RenderGoal.conciseness</code>
        </a>
         goal, it doesn’t wrap the heading’s content in an anchor.</p>
</blockquote>
