    <hgroup>
      <p>Instance Method</p>
      <h1>parameters(_:)</h1>
    </hgroup>
    <p>Creates a “parameters” section that describes all the parameters for a symbol.</p>
    <pre><code>func parameters(_ info: [SourceLanguage : [ParameterInfo]]) -> [HTMLNode]</code></pre>
  </section>
  <h2>Discussion</h2>
  <p>If each language representation of the symbol has its own language-specific parameters, pass the parameter information for all language representations.</p>
  <p>
    If all language representations of the symbol have the <i>same</i> parameters, only pass the parameter information for one language. This produces a “parameters” section that doesn’t hide any parameters for any of the languages (same as if the symbol only had one language representation)
  </p>
