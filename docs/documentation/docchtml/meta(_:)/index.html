    <p>Function</p>
    <h1>meta(_:)</h1>
    <p>Creates a new <code>&lt;meta&gt;</code>
         meta element with the given attributes.</p>
    <pre>
        <code>func meta(_ attributes: HTMLNode.Attribute...) -&gt; HTMLNode</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>attributes</dt>
    <dd>
        <p>The list of attributes for the new element.</p>
    </dd>
</dl>
<h2>Return Value</h2>
<p>A new <code>&lt;meta&gt;</code>
     element.</p>
<h2>Discussion</h2>
<p>The <code>&lt;meta&gt;</code>
     element various kinds of metadata that cannot be expressed using the <code>&lt;title&gt;</code>
    , <code>&lt;base&gt;</code>
    , <code>&lt;link&gt;</code>
    , <code>&lt;style&gt;</code>
    , or <code>&lt;script&gt;</code>
     elements.</p>
