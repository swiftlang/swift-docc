    <hgroup>
      <p>Type Property</p>
      <h1>omitOptionalEndTags</h1>
    </hgroup>
    <p>Configures the formatter to omit end tags for elements and situations where the end of the tag can be inferred from what comes after, according to the HTML specification.</p>
    <pre><code>static let omitOptionalEndTags: HTMLFormatter.Options</code></pre>
  </section>
  <h2>Discussion</h2>
  <p>For example:</p>
  <pre><code>&lt;dl>&lt;dt>range&lt;dd>&lt;p>The range in which to create a random value.&lt;/dl>
</code></pre>
  <p>
    or combined with the 
    <a href="../prettyprint/index.html">
      <code>prettyPrint</code>
    </a>
     option:
  </p>
  <pre><code>&lt;dl>
  &lt;dt>range
  &lt;dd>
    &lt;p>The range in which to create a random value.
&lt;/dl>
</code></pre>
