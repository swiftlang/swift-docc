    <p>Type Property</p>
    <h1>omitOptionalEndTags</h1>
    <p>Configures the formatter to omit end tags for elements and situations where the end of the tag can be inferred from what comes after, according to the HTML specification.</p>
    <pre>
        <code>static let omitOptionalEndTags: HTMLFormatter.Options</code>
    </pre>
</section>
<h2>Discussion</h2>
<p>For example:</p>
<pre>
    <code>&lt;dl&gt;&lt;dt&gt;range&lt;dd&gt;&lt;p&gt;The range in which to create a random value.&lt;/dl&gt;
</code>
</pre>
<p>or combined with the <a href="../prettyprint/index.html">
        <code>prettyPrint</code>
    </a>
     option:</p>
<pre>
    <code>&lt;dl&gt;
  &lt;dt&gt;range
  &lt;dd&gt;
    &lt;p&gt;The range in which to create a random value.
&lt;/dl&gt;
</code>
</pre>
