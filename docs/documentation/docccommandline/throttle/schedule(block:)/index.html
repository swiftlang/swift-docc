    <p>Instance Method</p>
    <h1>schedule(block:)</h1>
    <p>Schedule a block for execution.</p>
    <pre>
        <code>func schedule(block: @escaping () -&gt; Void)</code>
    </pre>
</section>
<h2>Discussion</h2>
<p>Scheduling a <code>block</code>
    , executes it after the pre-set interval of time for the current <code>Throttle</code>
     instance. If you schedule a new block before the throttle interval has passed, the previous block is canceled in favor of the latest one.</p>
