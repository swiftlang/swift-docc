    <h1>Throttle</h1>
    <p>A task scheduler that throttles execution within a given time interval.</p>
    <pre>
        <code>class Throttle</code>
    </pre>
</section>
<h2>Overview</h2>
<p>Schedule blocks of work with <a href="schedule(block:)/index.html">
        <code>schedule(block:)</code>
    </a>
     and <code>Throttle</code>
     will execute only the latest scheduled task in the last amount of seconds you set via <a href="init(interval:)/index.html">
        <code>init(interval:)</code>
    </a>
    .</p>
<h2>Topics</h2>
<h3>Initializers</h3>
<ul>
    <li>
        <a href="init(interval:)/index.html">
            <code>init(interval: DispatchTimeInterval)</code>
        </a>
        <p>Creates a new throttle that performs work after waiting the given timeout interval.</p>
    </li>
</ul>
<h3>Instance Methods</h3>
<ul>

        <a href="schedule(block:)/index.html">
            <code>func schedule(block: () -&gt; Void)</code>
        </a>
        <p>Schedule a block for execution.</p>
    </li>
</ul>
