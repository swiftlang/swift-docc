    <h1>DirectoryPathOption</h1>
    <p>A parsable argument for an optional directory path.</p>
    <pre>
        <code>protocol DirectoryPathOption : ParsableArguments</code>
    </pre>
</section>
<h2>Overview</h2>
<p>This option validates the provided path exists and that it’s a directory.</p>
