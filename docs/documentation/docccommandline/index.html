    <p>Framework</p>
    <h1>DocCCommandLine</h1>
    <p>Build custom documentation workflows by leveraging the DocC compiler pipeline.</p>
</section>
<h2>Overview</h2>
<p>DocCCommandLine provides a default, command-line workflow for DocC, powered by Swift <a href="https://apple.github.io/swift-argument-parser/documentation/argumentparser/">Argument Parser</a>
    . <code>docc</code>
     commands, such as <code>convert</code>
     and <code>preview</code>
    , are conformant <code>Action</code>
     types that use DocC to perform documentation tasks.</p>
<p>Use DocCCommandLine to build a custom, command-line interface and extend it with additional commands. To add a new sub-command called <code>example</code>
    , create a conformant <code>Action</code>
     type, <code>ExampleAction</code>
    , that performs the desired work, and add it as a sub-command. Optionally, you can also reuse any of the provided actions like <a href="convertaction/index.html">
        <code>ConvertAction</code>
    </a>
    .</p>
<pre class="swift">
    <code>public import ArgumentParser

public struct MyDocumentationTool: AsyncParsableCommand {
    public static var configuration = CommandConfiguration(
        abstract: "My custom documentation tool",
        subcommands: [ConvertAction.self, ExampleAction.self]
    )
    
    public init() {
    }
}

MyDocumentationTool.main()
</code>
</pre>
<p>Adding a new sub-command automatically adds routing and execution of its code, adds its description to the command-line help menu, and ensures validation for its expected arguments.</p>
