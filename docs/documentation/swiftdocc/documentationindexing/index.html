    <p>API Collection</p>
    <h1>Documentation Indexing</h1>
    <p>Create documentation indexes optimized for text search or navigation.</p>
</section>
<h2>Overview</h2>
<p>Each rendering model element adopts the <a href="../textindexing/index.html">
        <code>TextIndexing</code>
    </a>
     protocol in order to provide its indexable text content to an indexer which can be later queried for searching specific content.</p>
<h2>Topics</h2>
<h3>Search Index</h3>
<ul>
    <li>
        <a href="../indexable/index.html">
            <code>protocol Indexable</code>
        </a>
        <p>A value that can provide search results.</p>
    </li>
    <li>
        <a href="../textindexing/index.html">
            <code>protocol TextIndexing</code>
        </a>
        <p>A value that can collect plain text content for use in search indexing.</p>
    </li>
    <li>
        <a href="../indexingerror/index.html">
            <code>enum IndexingError</code>
        </a>
    </li>
    <li>
        <a href="../indexingrecord/index.html">
            <code>struct IndexingRecord</code>
        </a>
        <p>A structure containing indexing information for a <a href="../rendernode/index.html">
                <code>RenderNode</code>
            </a>
            .</p>
    </li>
    <li>
        <a href="../renderrelationshipsgroup/index.html">
            <code>struct RenderRelationshipsGroup</code>
        </a>
        <p>A structure holding the information about a given group of references. The group can have a title and an abstract that can be rendered if necessary.</p>
    </li>
    <li>
        <a href="../rendersection/index.html">
            <code>protocol RenderSection</code>
        </a>
    </li>
</ul>
<h3>Navigation Index</h3>
<ul>
    <li>
        <a href="../navigatorindex/index.html">
            <code>class NavigatorIndex</code>
        </a>
        <p>A <code>NavigatorIndex</code>
             contains all the necessary information to display the data inside a navigator. The data ranges from the tree to the necessary pieces of information to filter the content and perform actions in a fast way. A navigator index is created per bundle and needs a bundle identifier to correctly work. Anonymous bundles are allowed, but they limit the functionalities of the index.</p>
    </li>
    <li>
        <a href="../navigatortree/index.html">
            <code>class NavigatorTree</code>
        </a>
        <p>A <code>NavigatorTree</code>
             is a class holding information about a tree of data that can be navigated using a tree navigator.</p>
    </li>
    <li>
        <a href="../renderindex/index.html">
            <code>struct RenderIndex</code>
        </a>
        <p>A navigation index of the content in a DocC archive, optimized for rendering.</p>
    </li>
    <li>
        <a href="../navigatoritem/index.html">
            <code>class NavigatorItem</code>
        </a>
        <p>The <code>NavigatorItem</code>
             class describes a single entry in a navigator, providing the necessary information to display and process (such as filtering) a single item.</p>
    </li>
</ul>
<h3>Navigation Metadata</h3>
<p></p>
<ul>
    <li>
        <a href="../availabilityindex/index.html">
            <code>class AvailabilityIndex</code>
        </a>
        <p>The <code>AvailabilityIndex</code>
             class stores the information about availability for SDKs of symbols. The information if a symbol is available for a given platform and version is stored inside this index.</p>
    </li>
    <li>
        <a href="../rendernodedataextractor/index.html">
            <code>class RenderNodeDataExtractor</code>
        </a>
        <p>Extracts metadata from a render node.</p>
    </li>
    <li>
        <a href="../serializable/index.html">
            <code>protocol Serializable</code>
        </a>
        <p>Defines an object that can be represented as raw Data and therefore serialized to/deserialized from disk.</p>
    </li>
    <li>
        <a href="../anycodable/index.html">
            <code>struct AnyCodable</code>
        </a>
        <p>A type-erased codable value.</p>
    </li>
    <li>
        <a href="../anymetadata/index.html">
            <code>struct AnyMetadata</code>
        </a>
        <p>A type-erasing container for metadata.</p>
    </li>
    <li>
        <a href="../automaticcuration/index.html">
            <code>struct AutomaticCuration</code>
        </a>
        <p>A set of functions that add automatic symbol curation to a topic graph.</p>
    </li>
    <li>
        <a href="../interfacelanguage/index.html">
            <code>struct InterfaceLanguage</code>
        </a>
        <p>Interface Language identifies a programming language used to index a content of a documentation bundle.</p>
    </li>
    <li>
        <a href="../platform/index.html">
            <code>struct Platform</code>
        </a>
    </li>
    <li>
        <a href="../lmdbdata/index.html">
            <code>protocol LMDBData</code>
        </a>
        <p>A type with a customized data representation suited for storage inside an LMDB database.</p>
    </li>
</ul>
