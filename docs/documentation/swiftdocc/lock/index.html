    <h1>Lock</h1>

    <pre>
        <code>typealias Lock = Synchronized&lt;Void&gt;</code>
    </pre>
</section>

    <p>Prefer <a href="../synchronized/index.html">
            <code>Synchronized</code>
        </a>
         if you need to synchronize access to a given value instead of a generic lock.</p>
</blockquote>
