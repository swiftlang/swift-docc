    <p>Class</p>
    <h1>CallToAction</h1>
    <p>A directive that adds a prominent button or link to a page’s header.</p>
    <pre>
        <code>final class CallToAction</code>
    </pre>
</section>
<h2>Overview</h2>
<p>A “Call to Action” has two main components: a link or file path, and the link text to display.</p>
<p>The link path can be specified in one of two ways:</p>
<ul>
    <li>
        <p>The <code>url</code>
             parameter specifies a URL that will be used verbatim. Use this when you’re linking to an external page or externally-hosted file.</p>
    </li>
    <li>
        <p>The <code>path</code>
             parameter specifies the path to a file hosted within your documentation catalog. Use this if you’re linking to a downloadable file that you’re managing alongside your articles and tutorials.</p>
    </li>
</ul>
<p>The link text can also be specified in one of two ways:</p>
<ul>
    <li>
        <p>The <code>purpose</code>
             parameter can be used to use a default button label. There are two valid values:</p>
        <ul>
            <li>
                <p>
                    <code>download</code>
                     indicates that the link is to a downloadable file. The button will be labeled “Download”.</p>
            </li>
            <li>
                <p>
                    <code>link</code>
                     indicates that the link is to an external webpage.</p>
                <p>The button will be labeled “Visit” when used on article pages and “View Source” when used on sample code pages.</p>
            </li>
        </ul>
    </li>
    <li>
        <p>The <code>label</code>
             parameter specifies the literal text to use as the button label.</p>
    </li>
</ul>
<p>
    <code>@CallToAction</code>
     requires one of <code>url</code>
     or <code>path</code>
    , and one of <code>purpose</code>
     or <code>label</code>
    . Specifying both <code>purpose</code>
     and <code>label</code>
     is allowed, but the <code>label</code>
     will override the default label provided by <code>purpose</code>
    .</p>
<p>This directive is only valid within a <a href="../metadata/index.html">
        <code>Metadata</code>
    </a>
     directive:</p>
<pre class="markdown">
    <code>@Metadata {
    @CallToAction(url: "https://example.com/sample.zip", purpose: download)
}
</code>
</pre>
