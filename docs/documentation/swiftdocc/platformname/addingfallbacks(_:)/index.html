    <hgroup>
      <p>Type Method</p>
      <h1>addingFallbacks(_:)</h1>
    </hgroup>
    <p>Returns the given platforms with any missing fallback platforms added.</p>
    <pre><code>static func addingFallbacks(_ platforms: [PlatformName?]) -> [PlatformName?]</code></pre>
  </section>
  <h2>Parameters</h2>
  <dl>
    <dt>platforms</dt>
    <dd>
      <p>The original platforms array.</p>
    </dd>
  </dl>
  <h2>Return Value</h2>
  <p>The platforms array with fallback platforms added where applicable.</p>
  <h2>Discussion</h2>
  <p>
    This function uses the centralized <code>DefaultAvailability.fallbackPlatforms</code> mapping to ensure consistency with platform expansion logic used throughout the codebase.
  </p>
  <p>
    For example, when iOS is present in the platforms array, this function adds iPadOS and Mac Catalyst if they are not already included.
  </p>
