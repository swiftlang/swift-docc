      <h1>RenderNodeTranslator</h1>
    </hgroup>
    <p>A visitor which converts a semantic model into a render node.</p>
    <pre><code>struct RenderNodeTranslator</code></pre>
  </section>
  <h2>Mentioned In</h2>
  <ul>
    <li>
      <a href="../compilerpipeline/index.html">The Swift-DocC Pipeline</a>
    </li>
  </ul>
  <h2>Overview</h2>
  <p>
    The translator visits the contents of a 
    <a href="../documentationnode/index.html">
      <code>DocumentationNode</code>
    </a>
    ’s 
    <a href="../semantic/index.html">
      <code>Semantic</code>
    </a>
     model and creates a 
    <a href="../rendernode/index.html">
      <code>RenderNode</code>
    </a>
    . The translation is lossy, meaning that translating a 
    <a href="../rendernode/index.html">
      <code>RenderNode</code>
    </a>
     back to a 
    <a href="../semantic/index.html">
      <code>Semantic</code>
    </a>
     is not possible with full fidelity. For example, source markup syntax is not preserved during the translation.
  </p>
