    <h1>Emitting Diagnostics</h1>
    <p>Vend warnings and errors as part of an operation’s result.</p>
</section>
<h2>Overview</h2>
<p>When running a compilation from the command line <code>docc</code>
     prints all diagnostics as output. Emitting rich diagnostics is important for integrating the compilation output with automation tools or development environments.</p>
<p>The diagnostics emitted during discovery, loading, and processing documentation are available via the context <a href="../documentationcontext/diagnostics/index.html">
        <code>diagnostics</code>
    </a>
    .</p>
