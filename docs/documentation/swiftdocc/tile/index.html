    <h1>Tile</h1>
    <p>A semantic model for a view that links to a content type that you specify.</p>
    <pre>
        <code>final class Tile</code>
    </pre>
</section>
<h2>Overview</h2>
<p>A tile is a kind of thematic content block that contains links to resources such as sample code, videos, or forum topics.</p>
