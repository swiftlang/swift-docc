    <p>Type Method</p>
    <h1>decode(fromJSON:with:)</h1>
    <p>Decodes a render node value from the given JSON data.</p>
    <pre>
        <code>static func decode(fromJSON data: Data, with decoder: JSONDecoder = RenderJSONDecoder.makeDecoder()) throws -&gt; RenderNode</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>data</dt>
    <dd>
        <p>The JSON data to decode.</p>
    </dd>
    <dt>decoder</dt>
    <dd>
        <p>The object that decodes the JSON data.</p>
    </dd>
</dl>
<h2>Return Value</h2>
<p>The decoded render node value.</p>
<h2>Discussion</h2>
<blockquote class="aside throws">
    <p class="label">Throws</p>
    <p>A <a href="../codingerror/index.html">
            <code>RenderNode.CodingError</code>
        </a>
         in case the decoder is unable to find a key or value in the data, the type of a decoded value is wrong, or the data is corrupted.</p>
</blockquote>
