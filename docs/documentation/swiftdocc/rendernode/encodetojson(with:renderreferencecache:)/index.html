    <hgroup>
      <p>Instance Method</p>
      <h1>encodeToJSON(with:renderReferenceCache:)</h1>
    </hgroup>
    <p>Encodes a render node value as JSON data.</p>
    <pre><code>func encodeToJSON(with encoder: JSONEncoder = RenderJSONEncoder.makeEncoder(), renderReferenceCache: RenderReferenceCache? = nil) throws -> Data</code></pre>
  </section>
  <h2>Parameters</h2>
  <dl>
    <dt>encoder</dt>
    <dd>
      <p>The object that encodes the render node.</p>
    </dd>
    <dt>renderReferenceCache</dt>
    <dd>
      <p>
        A cache for encoded render reference data. When encoding a large number of render nodes, use the same cache instance to avoid encoding the same reference objects repeatedly.
      </p>
    </dd>
  </dl>
  <h2>Return Value</h2>
  <p>The data for the encoded render node.</p>
  <h2>Discussion</h2>
  <aside class="throws">
    <p class="label">
      Throws
    </p>
    <p>
      A 
      <a href="../codingerror/index.html">
        <code>RenderNode.CodingError</code>
      </a>
       in case the encoder couldn’t encode the render node.
    </p>
  </aside>
