    <p>Initializer</p>
    <h1>init(from:)</h1>
    <p>Creates a JSON pointer given a coding path.</p>
    <pre>
        <code>init(from codingPath: [any CodingKey])</code>
    </pre>
</section>
<h2>Discussion</h2>
<p>Use this initializer when creating JSON pointers during encoding. This initializer escapes components as defined by <a href="https://datatracker.ietf.org/doc/html/rfc6901">RFC6901</a>
    .</p>
