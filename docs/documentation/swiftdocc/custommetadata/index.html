    <p>Class</p>
    <h1>CustomMetadata</h1>
    <p>A directive that accepts an arbitrary key/value pair and emits it into the metadata of the page</p>
    <pre>
        <code>final class CustomMetadata</code>
    </pre>
</section>
<h2>Overview</h2>
<p>It accepts following parameters:</p>
<p>key- a key to identify a piece of metadata value- the value for the metadata</p>
<p>This directive is only valid within a <a href="../metadata/index.html">
        <code>Metadata</code>
    </a>
     directive:</p>
<pre>
    <code>@Metadata {
   @CustomMetadata(key: "country", value: "Belgium")
}
</code>
</pre>
