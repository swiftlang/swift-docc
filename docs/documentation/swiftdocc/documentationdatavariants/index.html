      <h1>DocumentationDataVariants</h1>
    </hgroup>
    <p>A model type that encapsulates variants of documentation node data.</p>
    <pre><code>struct DocumentationDataVariants&lt;Variant></code></pre>
  </section>
  <h2>Overview</h2>
  <p>
    Use this type to represent a piece of information about a documentation node that can have different values depending on some trait, e.g., the programming language the symbol was defined in.
  </p>
