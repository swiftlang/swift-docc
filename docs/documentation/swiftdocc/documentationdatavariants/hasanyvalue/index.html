    <hgroup>
      <p>Instance Property</p>
      <h1>hasAnyValue</h1>
    </hgroup>
    <p>Whether this variant collection has a default value or any variant set.</p>
    <pre><code>var hasAnyValue: Bool { get }</code></pre>
  </section>
  <h2>Discussion</h2>
  <p>
    If the variant type is a collection type, this property will also make sure that any collection value, whether in the default value or any variant value, is non-empty. In other words, if a <code>DocumentationDataVariants&lt;[String]></code> has a default value of <code>[]</code> and no variants, this property will still return false.
  </p>
