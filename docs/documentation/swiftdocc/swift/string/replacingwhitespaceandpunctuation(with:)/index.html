    <hgroup>
      <p>Instance Method</p>
      <h1>replacingWhitespaceAndPunctuation(with:)</h1>
    </hgroup>
    <p>Returns a copy of the string with all whitespace and punctuation replaced with a given separator.</p>
    <pre><code>func replacingWhitespaceAndPunctuation(with separator: String) -> String</code></pre>
  </section>
  <h2>Parameters</h2>
  <dl>
    <dt>separator</dt>
    <dd>
      <p>The string to replace contiguous sequences of whitespace and punctuation with.</p>
    </dd>
  </dl>
  <h2>Return Value</h2>
  <p>A new string with all whitespace and punctuation replaced with a given separator.</p>
  <h2>Discussion</h2>
  <p>Contiguous sequences of whitespace and punctuation is replaced with a single separator.</p>
