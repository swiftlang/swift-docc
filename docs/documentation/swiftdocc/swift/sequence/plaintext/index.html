      <h1>plainText</h1>
    </hgroup>
    <p>Returns a lossy conversion of the formatted content to a plain-text string.</p>
    <pre><code>var plainText: String { get }</code></pre>
  </section>
  <h2>Discussion</h2>
  <p>
    This implementation is necessarily limited because it doesn’t make use of any collected <code>RenderReference</code> items. In many cases, it may make more sense to use the <code>rawIndexableTextContent</code> function that does use <code>RenderReference</code> for a more accurate textual representation of <code>RenderInlineContent.image</code> and <code>RenderInlineContent.reference</code>.
  </p>
