    <h1>CodeColorsPreferenceKey</h1>
    <p>Represents a code color-customization point for clients.</p>
    <pre>
        <code>struct CodeColorsPreferenceKey</code>
    </pre>
</section>
<h2>Overview</h2>
<p>A key defines a code-listing component that renderers use for syntax highlighting.</p>
<blockquote class="aside note">
    <p class="label">Note</p>
    <p>Preference keys are backed by strings, so you can add new keys without breaking the public API.</p>
</blockquote>
