    <h1>RenderBlockContent</h1>
    <p>A block content element.</p>
    <pre>
        <code>enum RenderBlockContent</code>
    </pre>
</section>
<h2>Overview</h2>
<p>Block elements introduce a break in their container’s layout flow, and usually represent a discrete item of their parent’s content.</p>
<p>Historically, the name “block element” comes from rendering scrollable, vertical content. A block element introduced a break in the horizontal flow, was preceded with an empty new line, and took the whole width, which started a new horizontal flow. These are headings, paragraphs, tables, and more.</p>
<pre>
    <code>[ Paragraph ...    ]
- - - - - - - - - -
[ Aside Note ...   ]
- - - - - - - - - -
[ Code Listing ... ]
- - - - - - - - - - 
[ Paragraph ...    ]
</code>
</pre>
<p>
    <code>RenderBlockContent</code>
     contains traditional elements like <a href="paragraph(_:)/index.html">
        <code>RenderBlockContent.paragraph(_:)</code>
    </a>
     and <a href="heading(_:)/index.html">
        <code>RenderBlockContent.heading(_:)</code>
    </a>
     but also other documentation-specific elements like <a href="step(_:)/index.html">
        <code>RenderBlockContent.step(_:)</code>
    </a>
     and <a href="endpointexample(_:)/index.html">
        <code>RenderBlockContent.endpointExample(_:)</code>
    </a>
    .</p>
<p>Block elements can be nested, for example, an aside note contains one or more paragraphs of text.</p>
