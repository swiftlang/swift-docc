    <p>Initializer</p>
    <h1>init(header:rawAlignments:rows:extendedData:metadata:)</h1>
    <p>Creates a new table with the given data.</p>
    <pre>
        <code>init(header: HeaderType, rawAlignments: [ColumnAlignment]? = nil, rows: [TableRow], extendedData: Set&lt;TableCellExtendedData&gt;, metadata: RenderContentMetadata? = nil)</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>header</dt>
    <dd>
        <p>The style of header in this table.</p>
    </dd>
    <dt>rawAlignments</dt>
    <dd>
        <p>The text alignment for each column in this table. If all the alignments are <a href="../../columnalignment/unset/index.html">
                <code>RenderBlockContent.ColumnAlignment.unset</code>
            </a>
            , the <a href="../alignments/index.html">
                <code>alignments</code>
            </a>
             property will be set to <code>nil</code>
            .</p>
    </dd>
    <dt>rows</dt>
    <dd>
        <p>The cell data for this table.</p>
    </dd>
    <dt>extendedData</dt>
    <dd>
        <p>Any extended information that describes cells in this table.</p>
    </dd>
    <dt>metadata</dt>
    <dd>
        <p>Additional metadata for this table, if necessary.</p>
    </dd>
</dl>
