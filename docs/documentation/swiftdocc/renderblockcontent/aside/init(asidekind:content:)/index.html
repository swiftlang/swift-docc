    <p>Initializer</p>
    <h1>init(asideKind:content:)</h1>
    <p>Creates an aside from a Swift Markdown aside kind and block content.</p>
    <pre>
        <code>init(asideKind: Markdown.Aside.Kind, content: [RenderBlockContent])</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>asideKind</dt>
    <dd>
        <p>The Swift Markdown aside kind</p>
    </dd>
    <dt>content</dt>
    <dd>
        <p>The block content to display in the aside</p>
    </dd>
</dl>
<h2>Discussion</h2>
<p>The new aside will have a name and style based on the display name of the Swift Markdown aside kind.</p>
<blockquote class="aside note">
    <p class="label">Note</p>
    <p> If the Swift Markdown aside kind is unknown, then the new aside will have a name and style set to the Swift Markdown aside kind, capitalized if necessary.</p>
</blockquote>
