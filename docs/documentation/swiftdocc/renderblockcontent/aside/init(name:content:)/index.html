    <p>Initializer</p>
    <h1>init(name:content:)</h1>
    <p>Creates an aside from a name and block content.</p>
    <pre>
        <code>init(name: String, content: [RenderBlockContent])</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>name</dt>
    <dd>
        <p>The name of the aside.</p>
    </dd>
    <dt>content</dt>
    <dd>
        <p>The block content to display in the aside</p>
    </dd>
</dl>
<h2>Discussion</h2>
<p>The new aside will have a style set to the lowercased name.</p>
<blockquote class="aside note">
    <p class="label">Note</p>
    <p> If the lowercased name doesn’t match one of the aside styles supported by DocC Render (one of note, tip, experiment, important, or warning) this will set the style to be note.</p>
</blockquote>
