    <h1>init(style:content:)</h1>
    <p>Creates an aside from an aside style and block content.</p>
    <pre>
        <code>init(style: AsideStyle, content: [RenderBlockContent])</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>style</dt>
    <dd>
        <p>The style of this aside</p>
    </dd>
    <dt>content</dt>
    <dd>
        <p>The block content to display in the aside</p>
    </dd>
</dl>
<h2>Discussion</h2>
<p>The new aside will have a name set to the capitalized style.</p>
