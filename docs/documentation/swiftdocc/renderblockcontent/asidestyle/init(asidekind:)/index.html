    <hgroup>
      <p>Initializer</p>
      <h1>init(asideKind:)</h1>
    </hgroup>
    <p>Creates an aside style from a Swift Markdown aside kind.</p>
    <pre><code>init(asideKind: Markdown.Aside.Kind)</code></pre>
  </section>
  <h2>Parameters</h2>
  <dl>
    <dt>asideKind</dt>
    <dd>
      <p>The Swift Markdown aside kind</p>
    </dd>
  </dl>
  <h2>Discussion</h2>
  <p>
    The new aside style’s underlying raw string value will be the markdown aside kind’s raw value.
  </p>
  <aside class="note">
    <p class="label">
      Note
    </p>
    <p>
       If the lowercased raw value doesn’t match one of the aside styles supported by DocC Render (one of note, tip, experiment, important, or warning) the new aside style’s raw value will be set to note.
    </p>
  </aside>
