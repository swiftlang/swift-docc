    <p>Initializer</p>
    <h1>init(rawValue:)</h1>
    <p>Creates an aside style.</p>
    <pre>
        <code>init(rawValue: String)</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>rawValue</dt>
    <dd>
        <p>The underlying raw string value.</p>
    </dd>
</dl>
<h2>Discussion</h2>
<p>The new aside style’s underlying raw string value will be lowercased.</p>
<blockquote class="aside note">
    <p class="label">Note</p>
    <p> If the lowercased raw value doesn’t match one of the aside styles supported by DocC Render (one of note, tip, experiment, important, or warning) the new aside style’s raw value will be set to note.</p>
</blockquote>
