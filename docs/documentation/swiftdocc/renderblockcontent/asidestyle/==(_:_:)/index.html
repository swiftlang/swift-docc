    <h1>==(_:_:)</h1>
    <p>Returns a Boolean value indicating whether two aside styles are equal.</p>
    <pre>
        <code>static func == (lhs: AsideStyle, rhs: AsideStyle) -&gt; Bool</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>lhs</dt>
    <dd>
        <p>An aside style to compare.</p>
    </dd>
    <dt>rhs</dt>
    <dd>
        <p>Another aside style to compare.</p>
    </dd>
</dl>
<h2>Discussion</h2>
<p>The comparison uses <a href="../rawvalue/index.html">
        <code>rawValue</code>
    </a>
     and is case-insensitive.</p>
