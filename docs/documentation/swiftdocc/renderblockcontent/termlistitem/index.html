<h2>Overview</h2>
<p>Includes a named term and its definition, that look like:</p>
<ul>
    <li>
        <p>term: “Generic Types”</p>
    </li>
    <li>
        <p>definition: “Custom classes, structures, and enumerations that can work with any type, in a similar way to <code>Array</code>
             and <code>Dictionary</code>
            .”</p>
    </li>
</ul>
<p>The term contains a list of inline elements to allow formatting while, the definition can be any free-form content including images, paragraphs, tables, etc.</p>
