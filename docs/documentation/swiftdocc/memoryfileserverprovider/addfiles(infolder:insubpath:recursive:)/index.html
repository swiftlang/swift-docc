    <h1>addFiles(inFolder:inSubPath:recursive:)</h1>
    <p>Adds files from the <code>source</code>
         directory to the <code>destination</code>
         directory in the file server.</p>
    <pre>
        <code>func addFiles(inFolder source: String, inSubPath destination: String = "", recursive: Bool = true)</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>source</dt>
    <dd>
        <p>The source directory to add files from.</p>
    </dd>
    <dt>destination</dt>
    <dd>
        <p>The destination directory in the file server to add the files to.</p>
    </dd>
    <dt>recursive</dt>
    <dd>
        <p>Whether or not to recursively add files from the source directory.</p>
    </dd>
</dl>
