    <p>Enumeration</p>
    <h1>TopicReference</h1>
    <p>A resolved or unresolved reference to a piece of documentation.</p>
    <pre>
        <code>enum TopicReference</code>
    </pre>
</section>
<h2>Overview</h2>
<p>A reference can exist in one of three states:</p>
<ul>
    <li>
        <p>It has not yet been resolved.</p>
    </li>
    <li>
        <p>It has successfully resolved.</p>
    </li>
    <li>
        <p>It has failed to resolve.</p>
    </li>
</ul>
<p>References that have resolved, either successfully or not, are represented by <a href="../topicreferenceresolutionresult/index.html">
        <code>TopicReferenceResolutionResult</code>
    </a>
    .</p>
