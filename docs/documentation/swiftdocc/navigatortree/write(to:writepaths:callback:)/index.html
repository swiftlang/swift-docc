    <p>Instance Method</p>
    <h1>write(to:writePaths:callback:)</h1>
    <p>Serialize the node and descendants to the disk. Every node is written in order using a breath first approach, assigning to each node a virtual identifier in <code>UInt32</code>
         which is then used to identify the parent. The initial index is 0 and the root gets id 0 and parent id 0, so it can be easily recognized inside the serialized data and it’s expected to be the first element.</p>
    <pre>
        <code>func write(to url: URL, writePaths: Bool = false, callback: ((Node) -&gt; ())? = nil) throws</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>url</dt>
    <dd>
        <p>The URL to the file in which the tree gets serialized.</p>
    </dd>
    <dt>writePaths</dt>
    <dd>
        <p>If true, writes the path component to disk.</p>
    </dd>
    <dt>callback</dt>
    <dd>
        <p>A block called each time after a node is written to the disk. If the nodes are N, the block is called N times.</p>
    </dd>
</dl>
