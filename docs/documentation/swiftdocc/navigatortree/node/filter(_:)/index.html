    <hgroup>
      <p>Instance Method</p>
      <h1>filter(_:)</h1>
    </hgroup>
    <p>Returns a node containing, in order, the elements of the tree that satisfy the given predicate.</p>
    <pre><code>func filter(_ isIncluded: (NavigatorItem) -> Bool) -> Node?</code></pre>
  </section>
  <h2>Parameters</h2>
  <dl>
    <dt>isIncluded</dt>
    <dd>
      <p>A closure that takes an element of the node as its argument and returns a Boolean value indicating whether the element should be included in the returned tree.</p>
    </dd>
  </dl>
  <h2>Return Value</h2>
  <p>A node of the elements that isIncluded allowed.</p>
  <h2>Discussion</h2>
  <aside class="note">
    <p class="label">
      Note
    </p>
    <p>The returned node contains a copy of the original ones.</p>
  </aside>
