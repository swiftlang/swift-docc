    <p>Instance Property</p>
    <h1>hasNoExpandedDocumentation</h1>
    <p>Whether there isn’t a version of the page with more content that a renderer can link to.</p>
    <pre>
        <code>var hasNoExpandedDocumentation: Bool</code>
    </pre>
</section>
<h2>Discussion</h2>
<p>This property indicates to renderers that an expanded version of the page does not exist for this render node, which, for example, controls whether a ‘View More’ link should be displayed or not.</p>
<p>It’s the renderer’s responsibility to fetch the full version of the page, for example using the <a href="../../rendernode/variants/index.html">
        <code>variants</code>
    </a>
     property.</p>
