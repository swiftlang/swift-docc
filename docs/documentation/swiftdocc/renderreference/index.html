    <h1>RenderReference</h1>
    <p>A reference to a resource.</p>
    <pre>
        <code>protocol RenderReference : Decodable, Encodable</code>
    </pre>
</section>
<h2>Overview</h2>
<p>The reference can refer to a resource within a unit of documentation (e.g., another symbol) or an external resource (e.g., a web URL). Check the conforming types to browse the different kinds of references.</p>
