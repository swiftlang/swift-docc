    <p>Initializer</p>
    <h1>init(traits:kind:url:title:abstract:language:declarationFragments:)</h1>
    <p>Creates a new resolved information variant with the values that are different from the resolved information values.</p>
    <pre>
        <code>init(traits: [RenderNode.Variant.Trait], kind: VariantValue&lt;DocumentationNode.Kind&gt; = nil, url: VariantValue&lt;URL&gt; = nil, title: VariantValue&lt;String&gt; = nil, abstract: VariantValue&lt;String&gt; = nil, language: VariantValue&lt;SourceLanguage&gt; = nil, declarationFragments: VariantValue&lt;DeclarationFragments?&gt; = nil)</code>
    </pre>
    <blockquote class="aside deprecated">
        <p class="label">Deprecated</p>
        <p>This type is only used in the outdated, and no longer recommended, version of the out-of-process external resolver communication protocol.</p>
    </blockquote>
