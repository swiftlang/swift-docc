    <p>Structure</p>
    <h1>OutOfProcessReferenceResolver.ResolvedInformation.Variant</h1>
    <p>A variant of content for the resolved information.</p>
    <pre>
        <code>struct Variant</code>
    </pre>
    <blockquote class="aside deprecated">
        <p class="label">Deprecated</p>
        <p>This type is only used in the outdated, and no longer recommended, version of the out-of-process external resolver communication protocol.</p>
    </blockquote>
</section>
<h2>Overview</h2>
<blockquote class="aside note">
    <p class="label">Note</p>
    <p>All properties except for <a href="traits/index.html">
            <code>traits</code>
        </a>
         are optional. If a property is <code>nil</code>
         it means that the value is the same as the resolved information’s value.</p>
</blockquote>
