    <p>Initializer</p>
    <h1>init(kind:url:title:abstract:language:availableLanguages:platforms:declarationFragments:topicImages:references:variants:)</h1>
    <p>Creates a new resolved information value with all its values.</p>
    <pre>
        <code>init(kind: DocumentationNode.Kind, url: URL, title: String, abstract: String, language: SourceLanguage, availableLanguages: Set&lt;SourceLanguage&gt;, platforms: [PlatformAvailability]? = nil, declarationFragments: DeclarationFragments? = nil, topicImages: [TopicImage]? = nil, references: [any RenderReference]? = nil, variants: [Variant]? = nil)</code>
    </pre>
    <blockquote class="aside deprecated">
        <p class="label">Deprecated</p>
        <p>This type is only used in the outdated, and no longer recommended, version of the out-of-process external resolver communication protocol.</p>
    </blockquote>
</section>
<h2>Parameters</h2>
<dl>
    <dt>kind</dt>
    <dd>
        <p>The resolved kind.</p>
    </dd>
    <dt>url</dt>
    <dd>
        <p>The resolved URL.</p>
    </dd>
    <dt>title</dt>
    <dd>
        <p>The resolved title</p>
    </dd>
    <dt>abstract</dt>
    <dd>
        <p>The resolved (plain text) abstract.</p>
    </dd>
    <dt>language</dt>
    <dd>
        <p>The resolved language.</p>
    </dd>
    <dt>availableLanguages</dt>
    <dd>
        <p>The languages where the resolved node is available.</p>
    </dd>
    <dt>platforms</dt>
    <dd>
        <p>The platforms and their versions where the resolved node is available, if any.</p>
    </dd>
    <dt>declarationFragments</dt>
    <dd>
        <p>The resolved declaration fragments, if any. This is expected to be an abbreviated declaration for the symbol.</p>
    </dd>
    <dt>topicImages</dt>
    <dd>
        <p>Images that are used to represent the summarized element.</p>
    </dd>
    <dt>references</dt>
    <dd>
        <p>References used in the content of the summarized element.</p>
    </dd>
    <dt>variants</dt>
    <dd>
        <p>The variants of content for this resolver information.</p>
    </dd>
</dl>
