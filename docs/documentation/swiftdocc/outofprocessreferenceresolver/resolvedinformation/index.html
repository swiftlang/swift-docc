    <h1>OutOfProcessReferenceResolver.ResolvedInformation</h1>
    <p>A type used to transfer information about a resolved reference in the outdated and no longer recommended version of the external resolver communication protocol.</p>
    <pre>
        <code>struct ResolvedInformation</code>
    </pre>
    <blockquote class="aside deprecated">
        <p class="label">Deprecated</p>
        <p>This type is only used in the outdated, and no longer recommended, version of the out-of-process external resolver communication protocol.</p>
