    <hgroup>
      <p>Initializer</p>
      <h1>init(id:server:convertRequestIdentifier:)</h1>
    </hgroup>
    <p>Creates a new reference resolver that interacts with a documentation service.</p>
    <pre><code>init(id: DocumentationContext.Inputs.Identifier, server: DocumentationServer, convertRequestIdentifier: String?) throws</code></pre>
  </section>
  <h2>Parameters</h2>
  <dl>
    <dt>id</dt>
    <dd>
      <p>The identifier the server can resolve references for.</p>
    </dd>
    <dt>server</dt>
    <dd>
      <p>The server to send link resolution requests to.</p>
    </dd>
    <dt>convertRequestIdentifier</dt>
    <dd>
      <p>The identifier that the resolver will use for convert requests that it sends to the server.</p>
    </dd>
  </dl>
  <h2>Discussion</h2>
  <p>The documentation service is expected to be able to handle messages of kind “resolve-reference”.</p>
