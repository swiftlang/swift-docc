    <hgroup>
      <p>Case</p>
      <h1>OutOfProcessReferenceResolver.ResponseV2.failure(_:)</h1>
    </hgroup>
    <p>A response with human-readable information about the problem that the external link resolver encountered while resolving the requested link or symbol.</p>
    <pre><code>case failure(DiagnosticInformation)</code></pre>
  </section>
  <h2>Discussion</h2>
  <aside class="note">
    <p class="label">
      Note
    </p>
    <p>
      DocC doesn’t display any diagnostics about failed 
      <a href="../../requestv2/symbol(_:)/index.html">
        <code>OutOfProcessReferenceResolver.RequestV2.symbol(_:)</code>
      </a>
       requests because they wouldn’t be actionable; because they’re entirely automatic—based on unique identifiers in the symbol graph files—rather than authored references in the content.
    </p>
    <p>
      Your external link resolver still needs to send a response to each request but it doesn’t need to include details about the failure when responding to a 
      <a href="../../requestv2/symbol(_:)/index.html">
        <code>OutOfProcessReferenceResolver.RequestV2.symbol(_:)</code>
      </a>
       request.
    </p>
  </aside>
