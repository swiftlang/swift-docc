    <p>Structure</p>
    <h1>OutOfProcessReferenceResolver.ResponseV2.DiagnosticInformation</h1>
    <p>Information about why the external resolver failed to resolve the <code>link(_:)</code>
        , or <code>symbol(_:)</code>
         request.</p>
    <pre>
        <code>struct DiagnosticInformation</code>
    </pre>
</section>
<h2>Overview</h2>
<blockquote class="aside note">
    <p class="label">Note</p>
    <p>DocC doesn’t display any diagnostics about failed <a href="../../requestv2/symbol(_:)/index.html">
            <code>OutOfProcessReferenceResolver.RequestV2.symbol(_:)</code>
        </a>
         requests because they wouldn’t be actionable; because they’re entirely automatic—based on unique identifiers in the symbol graph files—rather than authored references in the content.</p>
    <p>Your external link resolver still needs to send a response to each request but it doesn’t need to include details about the failure when responding to a <a href="../../requestv2/symbol(_:)/index.html">
            <code>OutOfProcessReferenceResolver.RequestV2.symbol(_:)</code>
        </a>
         request.</p>
</blockquote>
