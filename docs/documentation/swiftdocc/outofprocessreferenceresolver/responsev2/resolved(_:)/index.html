    <hgroup>
      <p>Case</p>
      <h1>OutOfProcessReferenceResolver.ResponseV2.resolved(_:)</h1>
    </hgroup>
    <p>A response with the resolved information about the requested link or symbol.</p>
    <pre><code>case resolved(LinkDestinationSummary)</code></pre>
  </section>
  <h2>Discussion</h2>
  <p>
    The 
    <a href="../../../linkdestinationsummary/referenceurl/index.html">
      <code>referenceURL</code>
    </a>
     can have a “path” and “fragment” components that are different from what DocC sent in the 
    <a href="../../requestv2/link(_:)/index.html">
      <code>OutOfProcessReferenceResolver.RequestV2.link(_:)</code>
    </a>
     request. For example; if your resolver supports different spellings of the link—corresponding to a page’s different names in different language representations—you can return the common reference URL identifier for that page for all link spellings.
  </p>
  <aside class="note">
    <p class="label">
      Note
    </p>
    <p>
      DocC expects the resolved 
      <a href="../../../linkdestinationsummary/referenceurl/index.html">
        <code>referenceURL</code>
      </a>
       to have a “host” component that matches the 
      <a href="../../../documentationcontext/inputs/identifier/index.html">
        <code>DocumentationContext.Inputs.Identifier</code>
      </a>
       that your resolver provided in its initial 
      <a href="../identifierandcapabilities(_:_:)/index.html">
        <code>OutOfProcessReferenceResolver.ResponseV2.identifierAndCapabilities(_:_:)</code>
      </a>
       handshake message. Responding with a 
      <a href="../../../linkdestinationsummary/referenceurl/index.html">
        <code>referenceURL</code>
      </a>
       that doesn’t match the resolver’s provided 
      <a href="../../../documentationcontext/inputs/identifier/index.html">
        <code>DocumentationContext.Inputs.Identifier</code>
      </a>
       is undefined behavior.
    </p>
  </aside>
