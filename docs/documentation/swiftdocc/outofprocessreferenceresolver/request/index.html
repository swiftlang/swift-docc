    <hgroup>
      <p>Type Alias</p>
      <h1>OutOfProcessReferenceResolver.Request</h1>
    </hgroup>
    <p>An outdated version of a request message to send to the external link resolver.</p>
    <pre><code>typealias Request = _DeprecatedRequestV1</code></pre>
    <aside class="deprecated">
      <p class="label">
        Deprecated
      </p>
      <p>
        This version of the communication protocol is no longer recommended. Update to 
        <a href="../requestv2/index.html">
          <code>OutOfProcessReferenceResolver.RequestV2</code>
        </a>
         and 
        <a href="../responsev2/index.html">
          <code>OutOfProcessReferenceResolver.ResponseV2</code>
        </a>
         instead.
      </p>
      <p>
        The new version of the communication protocol both has a mechanism for expanding functionality in the future (through common 
        <a href="../capabilities/index.html">
          <code>OutOfProcessReferenceResolver.Capabilities</code>
        </a>
         between DocC and the external resolver) and supports richer responses for both successful and and failed requests.
      </p>
    </aside>
  </section>
  <h2>Discussion</h2>
  <p>This can either be a request to resolve a topic URL or to resolve a symbol based on its precise identifier.</p>
