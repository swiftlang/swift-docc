    <p>API Collection</p>
    <h1>Tutorials Rendering</h1>
    <p>Render tutorial-based, interactive, learning experiences.</p>
</section>
<h2>Overview</h2>
<p>A tutorial is made up of a list of content sections, each representing a section in the rendered tutorial page.</p>
<p>The top introduction section is represented by an <a href="../introrendersection/index.html">
        <code>IntroRenderSection</code>
    </a>
    , an interactive assessments section is represented by a <a href="../tutorialassessmentsrendersection/index.html">
        <code>TutorialAssessmentsRenderSection</code>
    </a>
    , a final call to action by a <a href="../calltoactionsection/index.html">
        <code>CallToActionSection</code>
    </a>
    , and so on.</p>
