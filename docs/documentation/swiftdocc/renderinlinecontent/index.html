    <p>Enumeration</p>
    <h1>RenderInlineContent</h1>
    <p>An inline content element.</p>
    <pre>
        <code>enum RenderInlineContent</code>
    </pre>
</section>
<h2>Overview</h2>
<p>Typically, a renderer will append inline elements to previous inline elements. Apart from simple content like an image or a piece of plain text, a renderer uses inline elements to style content.</p>
<p>These elements don’t introduce a break in their container’s layout flow like <a href="../renderblockcontent/index.html">
        <code>RenderBlockContent</code>
    </a>
     elements do.</p>
<pre>
    <code>[ Paragraph
   [Text] [Strong [Text]] [Text] [Emphasize [Reference]] ...
]
- - - - - - - -
[ Paragraph
  ...
]
</code>
</pre>
<p>Inline elements can be nested, for example, an inline piece of text can be wrapped in an emphasis element. Block elements cannot be nested in inline elements.</p>
