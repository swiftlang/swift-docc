    <p>Initializer</p>
    <h1>init(versionString:)</h1>
    <p>Creates a new version from the given string representation.</p>
    <pre>
        <code>init?(versionString: String)</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>versionString</dt>
    <dd>
        <p>A version as a string.</p>
    </dd>
</dl>
<h2>Discussion</h2>
<blockquote class="aside warning">
    <p class="label">warning</p>
    <p>Returns <code>nil</code>
         if the version string contains non-integer or negative numeric components; for example the strings “1.2.3-beta6” and “1.-2.3” are invalid inputs.</p>
</blockquote>
