    <hgroup>
      <p>Instance Method</p>
      <h1>transform(renderNode:context:)</h1>
    </hgroup>
    <p>Applies the two transformations, in sequence, to a given render node.</p>
    <pre><code>func transform(renderNode: RenderNode, context: RenderNodeTransformationContext) -> RenderNodeTransformationResult</code></pre>
  </section>
  <h2>Parameters</h2>
  <dl>
    <dt>renderNode</dt>
    <dd>
      <p>The node to transform.</p>
    </dd>
    <dt>context</dt>
    <dd>
      <p>The context in which the composed transformation transforms the node.</p>
    </dd>
  </dl>
  <h2>Return Value</h2>
  <p>The transformed node, and a possibly modified context that’s passed through both transformers.</p>
  <h2>Discussion</h2>
  <p>The composed transformation passes the output from the first transformation as the input to the second transformation.</p>
  <pre><code>┌─────────────────────────────┐
│  ┌────────┐     ┌────────┐  │
</code></pre>
  <p>
    ──┼─▶│        │────▶│        │──┼─▶ │  │ First  │     │ Second │  │ ──┼─▶│        │────▶│        │──┼─▶ │  └────────┘     └────────┘  │ └─────────────────────────────┘
  </p>
