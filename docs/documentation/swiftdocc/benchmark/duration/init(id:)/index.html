    <hgroup>
      <p>Initializer</p>
      <h1>init(id:)</h1>
    </hgroup>
    <p>Creates a new instance with the given name.</p>
    <pre><code>init(id: String)</code></pre>
  </section>
  <h2>Discussion</h2>
  <p>
    Since this metric can be used multiple times to measure the duration of various tasks, <code>init(id:)</code> requires you to provide an id for the task being measured. The <code>id</code> parameter will be appended to the metric identifier in the exported benchmark report to keep the various durations distinguishable like so: <code>duration-myTask1</code>, <code>duration-my-other-task</code>, etc.
  </p>
