    <hgroup>
      <p>Instance Property</p>
      <h1>documentPathsToConvert</h1>
    </hgroup>
    <p>The paths of the documentation nodes to convert.</p>
    <pre><code>var documentPathsToConvert: [String]?</code></pre>
  </section>
  <h2>Discussion</h2>
  <p>
    Use this property to indicate what documentation nodes should be converted. When 
    <a href="../externalidstoconvert/index.html">
      <code>externalIDsToConvert</code>
    </a>
     and 
    <a href=".">
      <code>documentPathsToConvert</code>
    </a>
     are both set, the documentation nodes that are in either arrays will be converted.
  </p>
  <p>
    If you want all the render nodes to be returned as part of the conversion’s response, set this property to <code>nil</code>.
  </p>
