    <p>Initializer</p>
    <h1>init(bundleInfo:featureFlags:externalIDsToConvert:documentPathsToConvert:includeRenderReferenceStore:bundleLocation:symbolGraphs:overridingDocumentationComments:knownDisambiguatedSymbolPathComponents:emitSymbolSourceFileURIs:markupFiles:tutorialFiles:miscResourceURLs:symbolIdentifiersWithExpandedDocumentation:)</h1>
    <p>Creates a request to convert in-memory documentation.</p>
    <pre>
        <code>init(bundleInfo: DocumentationContext.Inputs.Info, featureFlags: FeatureFlags = FeatureFlags(), externalIDsToConvert: [String]?, documentPathsToConvert: [String]? = nil, includeRenderReferenceStore: Bool? = nil, bundleLocation: URL? = nil, symbolGraphs: [Data], overridingDocumentationComments: [String : [Line]]? = nil, knownDisambiguatedSymbolPathComponents: [String : [String]]? = nil, emitSymbolSourceFileURIs: Bool = true, markupFiles: [Data], tutorialFiles: [Data] = [], miscResourceURLs: [URL], symbolIdentifiersWithExpandedDocumentation: [String : ExpandedDocumentationRequirements]? = nil)</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>bundleInfo</dt>
    <dd>
        <p>Information about the bundle to convert.</p>
    </dd>
    <dt>featureFlags</dt>
    <dd>
        <p>Feature flags to enable when performing this convert request.</p>
    </dd>
    <dt>externalIDsToConvert</dt>
    <dd>
        <p>The external IDs of the symbols to convert.</p>
    </dd>
    <dt>documentPathsToConvert</dt>
    <dd>
        <p>The paths of the documentation nodes to convert.</p>
    </dd>
    <dt>includeRenderReferenceStore</dt>
    <dd>
        <p>Whether the conversion’s render reference store should be included in the response.</p>
    </dd>
    <dt>bundleLocation</dt>
    <dd>
        <p>The file location of the documentation bundle to convert, if any.</p>
    </dd>
    <dt>symbolGraphs</dt>
    <dd>
        <p>The symbols graph data included in the documentation bundle to convert.</p>
    </dd>
    <dt>overridingDocumentationComments</dt>
    <dd>
        <p>The mapping of external symbol identifiers to lines of a documentation comment that overrides the value in the symbol graph.</p>
    </dd>
    <dt>knownDisambiguatedSymbolPathComponents</dt>
    <dd>
        <p>The mapping of external symbol identifiers to known disambiguated symbol path components.</p>
    </dd>
    <dt>emitSymbolSourceFileURIs</dt>
    <dd>
        <p>Whether the conversion’s rendered documentation should include source file location metadata.</p>
    </dd>
    <dt>markupFiles</dt>
    <dd>
        <p>The article and documentation extension file data included in the documentation bundle to convert.</p>
    </dd>
    <dt>tutorialFiles</dt>
    <dd>
        <p>The tutorial file data included in the documentation bundle to convert.</p>
    </dd>
    <dt>miscResourceURLs</dt>
    <dd>
        <p>The on-disk resources in the documentation bundle to convert.</p>
    </dd>
    <dt>symbolIdentifiersWithExpandedDocumentation</dt>
    <dd>
        <p>A dictionary of identifiers to requirements for these symbols to have expanded documentation available.</p>
    </dd>
</dl>
