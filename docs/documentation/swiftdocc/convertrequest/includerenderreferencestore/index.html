    <p>Instance Property</p>
    <h1>includeRenderReferenceStore</h1>
    <p>Whether the conversion’s render reference store should be included in the response.</p>
    <pre>
        <code>var includeRenderReferenceStore: Bool?</code>
    </pre>
</section>
<h2>Discussion</h2>
<p>The <a href="../../renderreferencestore/index.html">
        <code>RenderReferenceStore</code>
    </a>
     contains compiled information for documentation nodes registered in a context. This information can be used as a lightweight index of the available documentation content in the bundle that’s been converted.</p>
