    <h1>init(originalMarkup:name:image:content:chapters:redirects:)</h1>
    <p>Creates a new volume from the given parameters.</p>
    <pre>
        <code>init(originalMarkup: BlockDirective, name: String?, image: ImageMedia?, content: MarkupContainer?, chapters: [Chapter], redirects: [Redirect]?)</code>
    </pre>
