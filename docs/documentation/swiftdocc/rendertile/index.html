    <h1>RenderTile</h1>
    <p>A render-friendly representation of a view that links to a specified type of content.</p>
    <pre>
        <code>struct RenderTile</code>
    </pre>
</section>
<h2>Overview</h2>
<p>Depending on its type, a render tile contains links to a specific kind of resource such as sample code, videos, or forum topics.</p>
