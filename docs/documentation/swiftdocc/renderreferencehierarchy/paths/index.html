    <hgroup>
      <p>Instance Property</p>
      <h1>paths</h1>
    </hgroup>
    <p>The paths (breadcrumbs) that lead from the landing page to the given symbol.</p>
    <pre><code>let paths: [[String]]</code></pre>
  </section>
  <h2>Discussion</h2>
  <p>
    A single path is a list of topic-graph references, that trace the curation through the documentation hierarchy from a framework landing page to a given target symbol.
  </p>
  <p>Symbols curated multiple times have multiple paths, for example:</p>
  <ul>
    <li>
      <p>Example Framework / Example Type / Example Property</p>
    </li>
    <li>
      <p>Example Framework / My Article / Example Type / Example Property</p>
    </li>
    <li>
      <p>Example Framework / Related Type / Example Property</p>
    </li>
  </ul>
  <aside class="note">
    <p class="label">
      Note
    </p>
    <p>
      The first element in <code>paths</code> is the <i>canonical</i> breadcrumb for the symbol.
    </p>
  </aside>
  <p>Landing pages’ hierarchy contains a single, empty path.</p>
</article></noscript><div id="app"></div></body></html>
