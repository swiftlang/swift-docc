    <h1>MessageType</h1>
    <p>A description of the intent of a communication-bridge message.</p>
    <pre>
        <code>struct MessageType</code>
    </pre>
</section>
<h2>Overview</h2>
<p>Clients can use the type of the message to determine which handler to invoke.</p>
<blockquote class="aside note">
    <p class="label">Note</p>
    <p>Message types are backed by strings, so you can add new types without breaking the public API.</p>
</blockquote>
