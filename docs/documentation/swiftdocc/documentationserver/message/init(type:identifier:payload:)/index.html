    <p>Initializer</p>
    <h1>init(type:identifier:payload:)</h1>
    <p>Creates a documentation service message.</p>
    <pre>
        <code>init(type: MessageType, identifier: String = Self.randomIdentifierGenerator(), payload: Data?)</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>type</dt>
    <dd>
        <p>The type of the message, which is used to determine which service should process the message.</p>
    </dd>
    <dt>identifier</dt>
    <dd>
        <p>The identifier of the message. By default, a random UUID string is created.</p>
    </dd>
    <dt>payload</dt>
    <dd>
        <p>The payload of the message, encoded in the format its handling service expects.</p>
    </dd>
</dl>
