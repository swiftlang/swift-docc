    <hgroup>
      <p>Instance Method</p>
      <h1>process(_:completion:)</h1>
    </hgroup>
    <p>Processes the given message and responds using the given completion closure.</p>
    <pre><code>func process(_ message: Data, completion: @escaping (Data) -> ())</code></pre>
  </section>
  <h2>Parameters</h2>
  <dl>
    <dt>message</dt>
    <dd>
      <p>The message the server should process.</p>
    </dd>
    <dt>completion</dt>
    <dd>
      <p>The closure the server calls when the message has been processed.</p>
    </dd>
  </dl>
  <h2>Discussion</h2>
  <p>
    The given message is expected to be a 
    <a href="../message/index.html">
      <code>DocumentationServer.Message</code>
    </a>
    , encoded as JSON. If the server cannot decode the message, the completion closure is called with a 
    <a href="../../documentationservererror/index.html">
      <code>DocumentationServerError</code>
    </a>
     message of type “unsupported-message-type”, encoded in JSON format.
  </p>
  <p>
    Once decoded, the server uses the message’s type to determine a service that can handle the message. If no service can handle the message, the completion closure is called with a 
    <a href="../../documentationservererror/index.html">
      <code>DocumentationServerError</code>
    </a>
     message of type “invalid-message”, encoded in JSON format.
  </p>
</article></noscript><div id="app"></div></body></html>
