    <p>Class</p>
    <h1>Semantic</h1>
    <p>A semantic object is an abstract element with children which also are semantic objects.</p>
    <pre>
        <code>class Semantic</code>
    </pre>
</section>
<h2>Overview</h2>
<p>The children of one semantic object doesn’t need to be the same type as their parent or even the same as each other. This allows semantic objects to describe a hierarchy of information that can be visited and altered in a structured manner using a <a href="../semanticvisitor/index.html">
        <code>SemanticVisitor</code>
    </a>
    .</p>
<p>Semantic objects are used to model the in-memory representation of documentation. Some key examples are <a href="../article/index.html">
        <code>Article</code>
    </a>
    , <a href="../symbol/index.html">
        <code>Symbol</code>
    </a>
    , and directives such as <a href="../tutorial/index.html">
        <code>Tutorial</code>
    </a>
    , <a href="../chapter/index.html">
        <code>Chapter</code>
    </a>
     and <a href="../volume/index.html">
        <code>Volume</code>
    </a>
    .</p>
