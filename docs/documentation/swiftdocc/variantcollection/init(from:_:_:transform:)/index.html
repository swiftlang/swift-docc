    <hgroup>
      <p>Initializer</p>
      <h1>init(from:_:_:transform:)</h1>
    </hgroup>
    <p>Creates a variant collection from three non-empty symbol variants data using the given transformation closure.</p>
    <pre><code>init?&lt;Value1, Value2, Value3>(from documentationDataVariants1: DocumentationDataVariants&lt;Value1>, _ documentationDataVariants2: DocumentationDataVariants&lt;Value2>, _ documentationDataVariants3: DocumentationDataVariants&lt;Value3>, transform: (DocumentationDataVariantsTrait, Value1, Value2, Value3) -> Value)</code></pre>
  </section>
  <h2>Discussion</h2>
  <p>
    If any of symbol data variants values are empty, this initializer returns <code>nil</code>.
  </p>
  <p>
    This initializer picks a variant (the Swift variant, if available) of the given symbol data as the default value for the variant collection. Other variants are encoded in the variant collection’s 
    <a href="../variants/index.html">
      <code>variants</code>
    </a>
    .
  </p>
