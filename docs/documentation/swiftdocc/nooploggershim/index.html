    <h1>NoOpLoggerShim</h1>
    <p>A shim for <code>os.Logger</code>
         that does nothing.</p>
    <pre>
        <code>struct NoOpLoggerShim</code>
    </pre>
</section>
<h2>Overview</h2>
<p>This type allows calling code to avoid using <code>#if canImport(os)</code>
     throughout the implementation.</p>
