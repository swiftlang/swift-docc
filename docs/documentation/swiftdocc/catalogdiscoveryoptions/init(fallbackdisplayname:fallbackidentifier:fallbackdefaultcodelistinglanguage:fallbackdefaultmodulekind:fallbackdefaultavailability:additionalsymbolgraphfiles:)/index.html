    <p>Initializer</p>
    <h1>init(fallbackDisplayName:fallbackIdentifier:fallbackDefaultCodeListingLanguage:fallbackDefaultModuleKind:fallbackDefaultAvailability:additionalSymbolGraphFiles:)</h1>
    <p>Creates new catalog discovery options with the given information.</p>
    <pre>
        <code>init(fallbackDisplayName: String? = nil, fallbackIdentifier: String? = nil, fallbackDefaultCodeListingLanguage: String? = nil, fallbackDefaultModuleKind: String? = nil, fallbackDefaultAvailability: DefaultAvailability? = nil, additionalSymbolGraphFiles: [URL] = [])</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>fallbackDisplayName</dt>
    <dd>
        <p>A fallback display name for the catalog.</p>
    </dd>
    <dt>fallbackIdentifier</dt>
    <dd>
        <p>A fallback identifier for the catalog.</p>
    </dd>
    <dt>fallbackDefaultCodeListingLanguage</dt>
    <dd>
        <p>A fallback default code listing language for the catalog.</p>
    </dd>
    <dt>fallbackDefaultModuleKind</dt>
    <dd>
        <p>A fallback default module kind for the catalog.</p>
    </dd>
    <dt>fallbackDefaultAvailability</dt>
    <dd>
        <p>A fallback default availability for the catalog.</p>
    </dd>
    <dt>additionalSymbolGraphFiles</dt>
    <dd>
        <p>Additional symbol graph files to augment any discovered catalogs.</p>
    </dd>
</dl>
<h2>Discussion</h2>
<p>The given fallback values will be used if any of the discovered catalogs are missing that value in their Info.plist configuration file.</p>
