    <hgroup>
      <p>Protocol</p>
      <h1>LMDBData</h1>
    </hgroup>
    <p>A type with a customized data representation suited for storage inside an LMDB database.</p>
    <pre><code>protocol LMDBData</code></pre>
  </section>
  <h2>Overview</h2>
  <p>
    Types that conform to the <code>LMDBData</code> protocol can provide their own representation to be used when converting an instance to a valid data representation ready for LMDB storage.
  </p>
  <aside class="note">
    <p class="label">
      Note
    </p>
    <p>
      Default implementations for some common Swift types are included. Custom types require an appropriate implementation of the conversion.
    </p>
  </aside>
