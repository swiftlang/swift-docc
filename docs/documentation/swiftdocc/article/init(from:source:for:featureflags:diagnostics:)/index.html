    <hgroup>
      <p>Initializer</p>
      <h1>init(from:source:for:featureFlags:diagnostics:)</h1>
    </hgroup>
    <p>Initializes a new article with a given markup and source for a given documentation bundle and documentation context.</p>
    <pre><code>convenience init?(from markup: any Markup, source: URL?, for inputs: DocumentationContext.Inputs, featureFlags: FeatureFlags, diagnostics: inout [Diagnostic])</code></pre>
  </section>
  <h2>Parameters</h2>
  <dl>
    <dt>markup</dt>
    <dd>
      <p>The markup that makes up this article’s content.</p>
    </dd>
    <dt>source</dt>
    <dd>
      <p>The location of the file that this article’s content comes from.</p>
    </dd>
    <dt>inputs</dt>
    <dd>
      <p>The collection of build inputs that the source file belongs to.</p>
    </dd>
    <dt>featureFlags</dt>
    <dd>
      <p>A set of feature flags that conditionally enable certain behaviors.</p>
    </dd>
    <dt>diagnostics</dt>
    <dd>
      <p>A mutable collection of diagnostics to update with any additional issues encountered while initializing the article.</p>
    </dd>
  </dl>
