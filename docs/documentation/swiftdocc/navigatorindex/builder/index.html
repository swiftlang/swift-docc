    <p>Class</p>
    <h1>NavigatorIndex.Builder</h1>
    <p>A <code>Builder</code>
         is a utility class to build a navigator index.</p>
    <pre>
        <code>class Builder</code>
    </pre>
</section>
<h2>Overview</h2>
<p>The builder generates an index for content navigation, but also maps important information to filter content based on availability, symbol type, platform and some others.</p>
<blockquote class="aside note">
    <p class="label">Note</p>
    <p>The builder is not thread safe and therefore, calling <code>index(renderNode:)</code>
         requires external synchronization in case the process is performed on different threads.</p>
</blockquote>
