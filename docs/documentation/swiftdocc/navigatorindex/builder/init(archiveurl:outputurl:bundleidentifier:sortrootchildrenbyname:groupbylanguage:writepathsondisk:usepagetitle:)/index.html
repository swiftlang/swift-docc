    <p>Initializer</p>
    <h1>init(archiveURL:outputURL:bundleIdentifier:sortRootChildrenByName:groupByLanguage:writePathsOnDisk:usePageTitle:)</h1>
    <p>Create a new a builder with the given data provider and output URL.</p>
    <pre>
        <code>init(archiveURL: URL? = nil, outputURL: URL, bundleIdentifier: String, sortRootChildrenByName: Bool = false, groupByLanguage: Bool = false, writePathsOnDisk: Bool = true, usePageTitle: Bool = false)</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>archiveURL</dt>
    <dd>
        <p>The location of the documentation archive that the builder builds an navigator index for.</p>
    </dd>
    <dt>outputURL</dt>
    <dd>
        <p>The location where the builder will write the the built navigator index.</p>
    </dd>
    <dt>bundleIdentifier</dt>
    <dd>
        <p>The bundle identifier of the documentation that the builder builds a navigator index for.</p>
    </dd>
    <dt>sortRootChildrenByName</dt>
    <dd>
        <p>Configure the builder to sort root’s children by name.</p>
    </dd>
    <dt>groupByLanguage</dt>
    <dd>
        <p>Configure the builder to group the entries by language.</p>
    </dd>
    <dt>writePathsOnDisk</dt>
    <dd>
        <p>Configure the builder to write each navigator item’s path components to the location.</p>
    </dd>
    <dt>usePageTitle</dt>
    <dd>
        <p>Configure the builder to use the “page title” instead of the “navigator title” as the title for each entry.</p>
    </dd>
</dl>
