    <h1>path(for:language:hashed:)</h1>

    <pre>
        <code>func path(for usr: String, language: InterfaceLanguage = .swift, hashed: Bool = false) -&gt; String?</code>
    </pre>
</section>

<dl>
    <dt>usr</dt>
    <dd>
        <p>The full USR or a hashed USR.</p>
    </dd>
    <dt>language</dt>
    <dd>
        <p>The interface language to look the USR for.</p>
    </dd>
    <dt>hashed</dt>
