    <p>Class</p>
    <h1>TabNavigator</h1>
    <p>A container directive that arranges content into a tab-based layout.</p>
    <pre>
        <code>final class TabNavigator</code>
    </pre>
</section>
<h2>Overview</h2>
<p>Create a new tab navigator by writing a <code>@TabNavigator</code>
     directive that contains child <code>@Tab</code>
     directives.</p>
<pre class="md">
    <code>@TabNavigator {
   @Tab("Powers") {
      ![A diagram with the five sloth power types.](sloth-powers)
   }

   @Tab("Exercise routines") {
      ![A sloth relaxing and enjoying a good book.](sloth-exercise)
   }

   @Tab("Hats") {
      ![A sloth discovering newfound confidence after donning a fedora.](sloth-hats)
   }
}
</code>
</pre>
