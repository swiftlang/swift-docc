    <p>Class</p>
    <h1>TabNavigator.Tab</h1>
    <p>A container directive that holds general markup content describing an individual tab within a tab-based layout.</p>
    <pre>
        <code>final class Tab</code>
    </pre>
</section>
<h2>Overview</h2>
<p>To add a new tab to a <a href="../index.html">
        <code>TabNavigator</code>
    </a>
    , add a <code>@Tab</code>
     directive within the content of the <code>@TabNavigator</code>
     directive.</p>
