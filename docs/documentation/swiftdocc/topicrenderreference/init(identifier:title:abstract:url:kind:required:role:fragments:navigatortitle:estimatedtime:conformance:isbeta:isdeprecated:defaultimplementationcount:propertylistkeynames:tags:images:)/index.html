    <p>Initializer</p>
    <h1>init(identifier:title:abstract:url:kind:required:role:fragments:navigatorTitle:estimatedTime:conformance:isBeta:isDeprecated:defaultImplementationCount:propertyListKeyNames:tags:images:)</h1>
    <p>Creates a new topic reference with all its initial values.</p>
    <pre>
        <code>init(identifier: RenderReferenceIdentifier, title: String, abstract: [RenderInlineContent], url: String, kind: RenderNode.Kind, required: Bool = false, role: String? = nil, fragments: [DeclarationRenderSection.Token]? = nil, navigatorTitle: [DeclarationRenderSection.Token]? = nil, estimatedTime: String? = nil, conformance: ConformanceSection? = nil, isBeta: Bool = false, isDeprecated: Bool = false, defaultImplementationCount: Int? = nil, propertyListKeyNames: PropertyListKeyNames? = nil, tags: [RenderNode.Tag]? = nil, images: [TopicImage] = [])</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>identifier</dt>
    <dd>
        <p>The identifier of this reference.</p>
    </dd>
    <dt>title</dt>
    <dd>
        <p>The title of the destination page.</p>
    </dd>
    <dt>abstract</dt>
    <dd>
        <p>The abstract of the destination page.</p>
    </dd>
    <dt>url</dt>
    <dd>
        <p>The topic url of the destination page.</p>
    </dd>
    <dt>kind</dt>
    <dd>
        <p>The kind of page that’s referenced.</p>
    </dd>
    <dt>required</dt>
    <dd>
        <p>Whether the reference is required in its parent context.</p>
    </dd>
    <dt>role</dt>
    <dd>
        <p>The additional “role” assigned to the symbol, if any.</p>
    </dd>
    <dt>fragments</dt>
    <dd>
        <p>The abbreviated declaration of the symbol to display in links, or <code>nil</code>
             if the referenced page is not a symbol.</p>
    </dd>
    <dt>navigatorTitle</dt>
    <dd>
        <p>The abbreviated declaration of the symbol to display in navigation, or <code>nil</code>
             if the referenced page is not a symbol.</p>
    </dd>
    <dt>estimatedTime</dt>
    <dd>
        <p>The estimated time to complete the topic.</p>
    </dd>
    <dt>conformance</dt>
    <dd>
        <p>Information about conditional conformance for the symbol, or <code>nil</code>
             if the referenced page is not a symbol.</p>
    </dd>
    <dt>isBeta</dt>
    <dd>
        <p>Whether this symbol is built for a beta platform, or <code>false</code>
             if the referenced page is not a symbol.</p>
    </dd>
    <dt>isDeprecated</dt>
    <dd>
        <p>Whether this symbol is deprecated, or <code>false</code>
             if the referenced page is not a symbol.</p>
    </dd>
    <dt>defaultImplementationCount</dt>
    <dd>
        <p>Number of default implementations for this symbol, or <code>nil</code>
             if the referenced page is not a symbol.</p>
    </dd>
    <dt>propertyListKeyNames</dt>
    <dd>
        <p>The names and style configuration for a property list key or entitlement key,  or <code>nil</code>
             if the referenced page is not a property list key or entitlement key.</p>
    </dd>
    <dt>tags</dt>
    <dd>
        <p>An optional list of string tags.</p>
    </dd>
    <dt>images</dt>
    <dd>
        <p>Author provided images that represent this page.</p>
    </dd>
</dl>
