    <p>Class</p>
    <h1>Symbol</h1>
    <p>A programming symbol semantic type.</p>
    <pre>
        <code>final class Symbol</code>
    </pre>
</section>
<h2>Overview</h2>
<p>This class’s properties are represented using <a href="../documentationdatavariants/index.html">
        <code>DocumentationDataVariants</code>
    </a>
     values which encode the different variants for each piece of information about the symbol. For example, if a symbol is available in multiple programming languages, the <a href="titlevariants/index.html">
        <code>titleVariants</code>
    </a>
     property represents the title of the symbol for each programming language it’s available in. Use a <a href="../documentationdatavariantstrait/index.html">
        <code>DocumentationDataVariantsTrait</code>
    </a>
     to access a specific variant.</p>
