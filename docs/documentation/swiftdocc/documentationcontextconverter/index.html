    <h1>DocumentationContextConverter</h1>
    <p>A converter from documentation nodes to render nodes.</p>
    <pre>
        <code>class DocumentationContextConverter</code>
    </pre>
</section>
<h2>Overview</h2>
<p>As this type makes use of a <code>RenderContext</code>
     to look up commonly used pieces of content, use this type when you are converting nodes in bulk.</p>
<p>If you are converting nodes ad-hoc use <a href="../documentationnodeconverter/index.html">
        <code>DocumentationNodeConverter</code>
    </a>
     instead.</p>
