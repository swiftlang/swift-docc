    <h1>Directives</h1>
    <p>Use structured, semantic, documentation elements authored in markup.</p>
</section>
<h2>Overview</h2>
<p>Besides having a custom init to initialize all required properties, most directives are easily created out of markup source. Each directive has a name, expected parameter list, and content expectations.</p>
<p>For example <a href="../contentandmedia/index.html">
        <code>ContentAndMedia</code>
    </a>
     requires at least one <code>Image</code>
     or <code>Video</code>
     directive in its enclosed content:</p>
<pre class="markdown">
    <code>@ContentAndMedia {
    Add the `EmailValidator` code.
         
    @Image(source: code.png,
           alt: "EmailValidator(string: email.stringValue).validate()")
}
</code>
</pre>
