    <h1>SwiftDocC</h1>
    <p>Combine code comments with markup prose to produce structured, semantic documentation.</p>

<h2>Overview</h2>
<p>DocC comes with built-in support for several types of input files. You group these files by placing them in a folder with a <code>.docc</code>
     extension. This folder is called a documentation catalog, and can include these file types:</p>
<ul>
    <li>
        <p>Lightweight markdown files that contain free-form articles or additional symbol documentation, with an <code>.md</code>
             extension.</p>
    </li>
    <li>
        <p>Tutorial files that include dynamic learning content, with a <code>.tutorial</code>
             extension.</p>
    </li>
    <li>
        <p>Asset files like images, videos, and archived projects for download, with known extensions like <code>.png</code>
            , <code>.jpg</code>
            , <code>.mov</code>
            , and <code>.zip</code>
            .</p>
    </li>
    <li>
        <p>Symbol-graph files that describe the symbols of your API, with an <code>.symbols.json</code>
             extension.</p>
    </li>
    <li>
        <p>An <code>Info.plist</code>
             file with optional metadata about the documentation.</p>
    </li>
    <li>
        <p>A <code>theme-settings.json</code>
             with theming customizations for the rendered output.</p>
    </li>
</ul>
<p>SwiftDocC provides the APIs you use to discover documentation inputs, load catalog content, parse the symbol-graph meta-information, extract symbol documentation, and pair that symbol documentation with external file content. DocC represents the compiled documentation in an in-memory model that you can further convert in a persistable representation for writing to disk.</p>
