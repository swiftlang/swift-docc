    <h1>VariantOverride</h1>
    <p>Defines an override for a JSON value for a set of traits.</p>
    <pre>
        <code>struct VariantOverride</code>
    </pre>
</section>
<h2>Overview</h2>
<p>Override values are contain the <a href="patch/index.html">
        <code>patch</code>
    </a>
     that should be applied for clients that want to process documentation for the override’s <a href="traits/index.html">
        <code>traits</code>
    </a>
    .</p>
