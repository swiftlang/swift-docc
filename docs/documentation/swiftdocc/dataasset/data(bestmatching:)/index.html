    <hgroup>
      <p>Instance Method</p>
      <h1>data(bestMatching:)</h1>
    </hgroup>
    <p>Returns the data that is registered to the data asset that best matches the given trait collection.</p>
    <pre><code>func data(bestMatching traitCollection: DataTraitCollection) -> BundleData</code></pre>
  </section>
  <h2>Discussion</h2>
  <p>
    If no variant matches the given trait collection exactly, the closest variant is returned. A matching user interface style is preferred over a matching display scale. If there are multiple matches, the one with the lexicographically smallest URL path is used.
  </p>
