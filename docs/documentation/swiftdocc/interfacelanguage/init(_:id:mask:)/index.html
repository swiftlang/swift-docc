    <hgroup>
      <p>Initializer</p>
      <h1>init(_:id:mask:)</h1>
    </hgroup>
    <p>Create an interface language with the given display name, id, and integer mask.</p>
    <pre><code>init(_ name: String, id: String, mask: Int)</code></pre>
  </section>
  <h2>Parameters</h2>
  <dl>
    <dt>name</dt>
    <dd>
      <p>The display name of the interface language.</p>
      <p>
        For example, this might be <code>"Swift"</code>, or <code>"Objective-C"</code>.
      </p>
    </dd>
    <dt>id</dt>
    <dd>
      <p>An identifier for the language.</p>
      <p>
        For example, Swift’s identifier is <code>"swift"</code> and Objective-C’s is “<code>occ</code>”.
      </p>
    </dd>
    <dt>mask</dt>
    <dd>
      <p>An integer mask used to uniquely identify the language.</p>
      <aside class="warning">
        <p class="label">
          Warning
        </p>
        <p>Only integer values between 3 and 7 are supported.</p>
      </aside>
    </dd>
  </dl>
