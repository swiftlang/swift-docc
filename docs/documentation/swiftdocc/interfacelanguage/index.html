    <h1>InterfaceLanguage</h1>
    <p>Interface Language identifies a programming language used to index a content of a documentation bundle.</p>
    <pre>
        <code>struct InterfaceLanguage</code>

<h2>Overview</h2>
<blockquote class="aside note">
    <p class="label">Note</p>
    <p>The name reflects what a render node JSON provides to identify a programming language. The name has been decided to avoid confusion with locale languages.</p>
</blockquote>
