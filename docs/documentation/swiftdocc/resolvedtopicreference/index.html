    <p>Structure</p>
    <h1>ResolvedTopicReference</h1>
    <p>A reference to a piece of documentation which has been verified to exist.</p>
    <pre>
        <code>struct ResolvedTopicReference</code>
    </pre>
</section>
<h2>Overview</h2>
<p>A <code>ResolvedTopicReference</code>
     refers to some piece of documentation, such as an article or symbol. Once an <code>UnresolvedTopicReference</code>
     has been resolved to this type, it should be guaranteed that the content backing the documentation is available (i.e. there is a file on disk or data in memory ready to be recalled at any time).</p>
<h2>Implementation Details</h2>
<p>
    <code>ResolvedTopicReference</code>
     is effectively a wrapper around Foundation’s <code>URL</code>
     and, because of this, it exposes an API very similar to <code>URL</code>
     and does not allow direct modification of its properties. This immutability brings performance benefits and communicates with user’s of the API that doing something like adding a path component is a potentially expensive operation, just as it is on <code>URL</code>
    .</p>
<blockquote class="aside important">
    <p class="label">Important</p>
    <p>This type has copy-on-write semantics and wraps an underlying class to store its data.</p>
</blockquote>
