    <p>Instance Method</p>
    <h1>appendingPath(_:)</h1>
    <p>Creates a new topic reference by appending a path to this reference.</p>
    <pre>
        <code>func appendingPath(_ path: String) -&gt; ResolvedTopicReference</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>path</dt>
    <dd>
        <p>The path to append.</p>
    </dd>
</dl>
<h2>Return Value</h2>
<p>The resulting topic reference.</p>
<h2>Discussion</h2>
<p>Before appending the path, it is encoded in a human readable format that avoids percent escape encoding in the URL.</p>
