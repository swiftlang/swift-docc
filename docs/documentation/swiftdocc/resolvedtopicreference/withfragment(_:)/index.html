    <hgroup>
      <p>Instance Method</p>
      <h1>withFragment(_:)</h1>
    </hgroup>
    <p>Creates a new topic reference with the given fragment.</p>
    <pre><code>func withFragment(_ fragment: String?) -> ResolvedTopicReference</code></pre>
  </section>
  <h2>Parameters</h2>
  <dl>
    <dt>fragment</dt>
    <dd>
      <p>The new fragment.</p>
    </dd>
  </dl>
  <h2>Return Value</h2>
  <p>The resulting topic reference.</p>
  <h2>Discussion</h2>
  <p>Before adding the fragment to the reference, the fragment is encoded in a human readable format that avoids percent escape encoding in the URL.</p>
  <p>You use a fragment to reference an element within a page:</p>
  <pre><code>doc://your..identifier/path/to/page#element-in-page
                                    ╰──────┬──────╯
                                        fragment
</code></pre>
  <p>
    On-page elements can then be linked to using a fragment need to conform to the 
    <a href="../../landmark/index.html">
      <code>Landmark</code>
    </a>
     protocol.
  </p>
</article></noscript><div id="app"></div></body></html>
