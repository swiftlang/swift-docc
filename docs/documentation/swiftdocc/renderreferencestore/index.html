    <h1>RenderReferenceStore</h1>
    <p>A storage for render reference information.</p>
    <pre>
        <code>struct RenderReferenceStore</code>
    </pre>
</section>
<h2>Overview</h2>
<p>This store stores render references which can be looked up during <a href="../rendernode/index.html">
        <code>RenderNode</code>
    </a>
     conversion. It’s commonly created by a <a href="../rendercontext/index.html">
        <code>RenderContext</code>
    </a>
    , which precomputes render reference information before render node conversion.</p>
