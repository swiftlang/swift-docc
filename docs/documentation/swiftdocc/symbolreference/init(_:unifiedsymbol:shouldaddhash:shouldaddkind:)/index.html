    <p>Initializer</p>
    <h1>init(_:unifiedSymbol:shouldAddHash:shouldAddKind:)</h1>
    <p>Creates a new reference to a symbol.</p>
    <pre>
        <code>init(_ identifier: String, unifiedSymbol: UnifiedSymbolGraph.Symbol? = nil, shouldAddHash: Bool = false, shouldAddKind: Bool = false)</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>identifier</dt>
    <dd>
        <p>The precise identifier of a symbol.</p>
    </dd>
    <dt>unifiedSymbol</dt>
    <dd>
        <p>The unified symbol graph node representing this symbol, if available.</p>
    </dd>
    <dt>shouldAddHash</dt>
    <dd>
        <p>If <code>true</code>
            , the new reference has a hash appended to its path.</p>
    </dd>
    <dt>shouldAddKind</dt>
    <dd>
        <p>If <code>true</code>
            , the new reference has the referenced-symbol kind appended to its path.</p>
    </dd>
</dl>
