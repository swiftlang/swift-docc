    <hgroup>
      <p>Initializer</p>
      <h1>init(_:interfaceLanguages:defaultSymbol:shouldAddHash:shouldAddKind:)</h1>
    </hgroup>
    <p>Creates a new reference to a symbol.</p>
    <pre><code>init(_ identifier: String, interfaceLanguages: Set&lt;SourceLanguage>, defaultSymbol symbol: SymbolGraph.Symbol? = nil, shouldAddHash: Bool = false, shouldAddKind: Bool = false)</code></pre>
  </section>
  <h2>Parameters</h2>
  <dl>
    <dt>identifier</dt>
    <dd>
      <p>The precise identifier of a symbol.</p>
    </dd>
    <dt>interfaceLanguages</dt>
    <dd>
      <p>The source languages of the symbol.</p>
    </dd>
    <dt>symbol</dt>
    <dd>
      <p>The default symbol graph node representing this symbol, if available.</p>
    </dd>
    <dt>shouldAddHash</dt>
    <dd>
      <p>
        If <code>true</code>, the new reference has a hash appended to its path.
      </p>
    </dd>
    <dt>shouldAddKind</dt>
    <dd>
      <p>
        If <code>true</code>, the new reference has the referenced-symbol kind appended to its path.
      </p>
    </dd>
  </dl>
  <h2>Discussion</h2>
  <p>
    The two symbols <code>MyFramework/Manager</code>, a class, and <code>MyFramework/manager</code>, a static variable, have the same topic reference paths. For such symbols, set <code>shouldAddKind</code> to <code>true</code> to add the symbol kind to the reference path and generate the unique paths <code>/myframework/manager-swift.class</code> and <code>/myframework/manager-swift.variable</code>.
  </p>
  <p>
    Another case might be two symbols of the same kind with colliding paths, for example, the variable <code>MyFramework/vaRiable</code> and <code>MyFramework/VARiable</code>. Set <code>shouldAddHash</code> to <code>true</code> to append a hash of the symbol name at the end of the path to make the two paths distinct.
  </p>
