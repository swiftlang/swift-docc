    <h1>AutomaticArticleSubheading</h1>
    <p>A directive that modifies Swift-DocC’s default behavior for automatic subheading generation on article pages.</p>
    <pre>
        <code>class AutomaticArticleSubheading</code>
    </pre>
</section>
<h2>Overview</h2>
<p>By default, articles receive a second-level “Overview” heading unless the author explicitly writes some other H2 heading below the abstract. This allows for opting out of that behavior.</p>
