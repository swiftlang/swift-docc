    <h1>RenderHierarchy</h1>
    <p>Hierarchical information for a render node.</p>

<h2>Overview</h2>
<p>A render node’s hierarchy information, such as its parent topics, describes an API reference hierarchy that starts with a framework landing page, or a Tutorials hierarchy that starts with a Tutorials landing page.</p>
