    <p>Instance Method</p>
    <h1>consume(mainContent:metadata:forPage:)</h1>
    <p>Consumes the HTML content and metadata for a given page.</p>
    <pre>
        <code>func consume(mainContent: HTMLNode, metadata: (title: String, description: String?), forPage reference: ResolvedTopicReference) throws</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>mainContent</dt>
    <dd>
        <p>The contents for this page.</p>
    </dd>
    <dt>metadata</dt>
    <dd>
        <p>Metadata information (title and description) about this page.</p>
    </dd>
    <dt>reference</dt>
    <dd>
        <p>The resolved topic reference that identifies this page.</p>
    </dd>
</dl>
<h2>Discussion</h2>
<p>The content and metadata doesn’t make up a full valid HTML page. It’s the consumers responsibility to insert the information into a template or skeletal structure to produce a valid HTML file for each page.</p>
