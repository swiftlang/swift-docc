    <p>Initializer</p>
    <h1>init(reference:symbol:platformName:moduleReference:article:featureFlags:engine:)</h1>
    <p>Initializes a documentation node to represent a symbol from a symbol graph.</p>
    <pre>
        <code>init(reference: ResolvedTopicReference, symbol: SymbolGraph.Symbol, platformName: String?, moduleReference: ResolvedTopicReference, article: Article?, featureFlags: FeatureFlags = .init(), engine: DiagnosticEngine)</code>
    </pre>
    <blockquote class="aside deprecated">
        <p class="label">Deprecated</p>
        <p>This API is only used from tests. It will be removed after 6.5 is released.</p>
    </blockquote>
</section>
<h2>Parameters</h2>
<dl>
    <dt>reference</dt>
    <dd>
        <p>The unique reference to the node.</p>
    </dd>
    <dt>symbol</dt>
    <dd>
        <p>The symbol to create a documentation node for.</p>
    </dd>
    <dt>platformName</dt>
    <dd>
        <p>The names of the platform that the symbol is available for.</p>
    </dd>
    <dt>moduleReference</dt>
    <dd>
        <p>A reference to the module that the symbol belongs to.</p>
    </dd>
    <dt>article</dt>
    <dd>
        <p>The documentation extension content for this symbol.</p>
    </dd>
    <dt>featureFlags</dt>
    <dd>
        <p>A collection of feature flags.</p>
    </dd>
    <dt>engine</dt>
    <dd>
        <p>The engine that collects any diagnostics encountered during initialization.</p>
    </dd>
</dl>
