    <p>Initializer</p>
    <h1>init(reference:kind:sourceLanguage:availableSourceLanguages:name:markup:semantic:platformNames:isVirtual:)</h1>
    <p>Initializes a documentation node with all its initial values.</p>
    <pre>
        <code>init(reference: ResolvedTopicReference, kind: Kind, sourceLanguage: SourceLanguage, availableSourceLanguages: Set&lt;SourceLanguage&gt;? = nil, name: Name, markup: any Markup, semantic: Semantic?, platformNames: Set&lt;String&gt;? = nil, isVirtual: Bool = false)</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>reference</dt>
    <dd>
        <p>The unique reference to the node.</p>
    </dd>
    <dt>kind</dt>
    <dd>
        <p>The type of node.</p>
    </dd>
    <dt>sourceLanguage</dt>
    <dd>
        <p>The programming language in which the node is relevant.</p>
    </dd>
    <dt>availableSourceLanguages</dt>
    <dd>
        <p>All the languages in which the node is available.</p>
    </dd>
    <dt>name</dt>
    <dd>
        <p>The name of the node.</p>
    </dd>
    <dt>markup</dt>
    <dd>
        <p>The markup that makes up the content for the node.</p>
    </dd>
    <dt>semantic</dt>
    <dd>
        <p>The parsed documentation structure that’s described by the documentation content.</p>
    </dd>
    <dt>platformNames</dt>
    <dd>
        <p>The names of the platforms for which the node is available.</p>
    </dd>
    <dt>isVirtual</dt>
    <dd>
        <p><code>true</code>
             if the node represents a virtual element that doesn’t represent a rendered page of documentation, <code>false</code>
             otherwise.</p>
    </dd>
</dl>
