    <p>Structure</p>
    <h1>DocumentationNode</h1>
    <p>A documentation node holds all the information about a documentation entity’s content.</p>
    <pre>
        <code>struct DocumentationNode</code>
    </pre>
</section>
<h2>Mentioned In</h2>
<ul>
    <li>
        <a href="../compilerpipeline/index.html">The Swift-DocC Pipeline</a>
    </li>
</ul>
<h2>Overview</h2>
<p>Information about relationships between documentation entities can be retrieved from the <a href="../documentationcontext/index.html">
        <code>DocumentationContext</code>
    </a>
    . The documentation context is also used to look up nodes by their unique <a href="reference/index.html">
        <code>reference</code>
    </a>
    .</p>
