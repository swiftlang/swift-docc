      <h1>rawIndexableTextContent(references:)</h1>
    </hgroup>
    <p>A concatenation of all raw text content under this value except for titles and headings.</p>
    <pre><code>func rawIndexableTextContent(references: [String : any RenderReference]) -> String</code></pre>
  </section>
  <h2>Parameters</h2>
  <dl>
    <dt>references</dt>
    <dd>
      <p>A dictionary of references to resolve ``RenderInlineContent.reference` elements’ inlined titles.</p>
    </dd>
  </dl>
  <h2>Discussion</h2>
  <aside class="note">

      Note
