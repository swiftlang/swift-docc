    <h1>SemanticVisitor</h1>

<h2>Overview</h2>
<blockquote class="aside note">
    <p class="label">Note</p>
    <p>This interface only provides requirements for visiting each kind of node. It does not require each visit method to descend into child nodes.</p>
</blockquote>
