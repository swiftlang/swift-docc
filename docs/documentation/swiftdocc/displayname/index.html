    <p>Class</p>
    <h1>DisplayName</h1>
    <p>A directive that controls how the documentation-extension file overrides the symbol’s display name.</p>
    <pre>
        <code>final class DisplayName</code>
    </pre>
</section>
<h2>Overview</h2>
<p>The <a href="name/index.html">
        <code>name</code>
    </a>
     property will override the symbol’s default display name.</p>
<p>When the <a href="style-swift.property/index.html">
        <code>style</code>
    </a>
     property is <a href="style-swift.enum/conceptual/index.html">
        <code>DisplayName.Style.conceptual</code>
    </a>
    , the symbol’s name is rendered as “conceptual”—same as article names or tutorial names—where applicable. The default style is <a href="style-swift.enum/conceptual/index.html">
        <code>DisplayName.Style.conceptual</code>
    </a>
    .</p>
<p>When the <a href="style-swift.property/index.html">
        <code>style</code>
    </a>
     property is <a href="style-swift.enum/symbol/index.html">
        <code>DisplayName.Style.symbol</code>
    </a>
    , the symbol’s name is rendered as “symbol”—same as article names or tutorial names—where applicable. The default style is <a href="style-swift.enum/conceptual/index.html">
        <code>DisplayName.Style.conceptual</code>
    </a>
    .</p>
<p>This directive is only valid within a <a href="../metadata/index.html">
        <code>Metadata</code>
    </a>
     directive:</p>
<pre>
    <code>@Metadata {
   @DisplayName("Custom Symbol Name", style: conceptual)
}
</code>
</pre>
