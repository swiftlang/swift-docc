    <p>Instance Method</p>
    <h1>send(_:using:)</h1>
    <p>Sends a message to the documentation renderer using the given handler.</p>
    <pre>
        <code>func send(_ message: Message, using handler: SendHandler) throws</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>message</dt>
    <dd>
        <p>The message to send to the renderer.</p>
    </dd>
    <dt>handler</dt>
    <dd>
        <p>A closure that performs the sending operation.</p>
    </dd>
</dl>
<h2>Discussion</h2>
<blockquote class="aside throws">
    <p class="label">Throws</p>
    <p>Throws a <code>CommunicationBridgeError.unableToEncodeMessage</code>
         if the given message could not be encoded.</p>
