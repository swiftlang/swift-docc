    <p>Initializer</p>
    <h1>init(from:source:for:problems:)</h1>
    <p>Initializes a new element with a given markup and source that’s part of a given documentation bundle.</p>
    <pre>
        <code>init?(from markup: any Markup, source: URL?, for bundle: DocumentationBundle, problems: inout [Problem])</code>
    </pre>
    <blockquote class="aside deprecated">
        <p class="label">Deprecated</p>
        <p>This deprecated API will be removed after 6.5 is released.</p>
    </blockquote>
</section>
<h2>Parameters</h2>
<dl>
    <dt>markup</dt>
    <dd>
        <p>The markup that makes up this element’s content.</p>
    </dd>
    <dt>source</dt>
    <dd>
        <p>The location of the file that this element’s content comes from.</p>
    </dd>
    <dt>bundle</dt>
    <dd>
        <p>The documentation bundle that the source file belongs to.</p>
    </dd>
    <dt>problems</dt>
    <dd>
        <p>A mutable collection of problems to update with any problem encountered while initializing the element.</p>
    </dd>
</dl>
