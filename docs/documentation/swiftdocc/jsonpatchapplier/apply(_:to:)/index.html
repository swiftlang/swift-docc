    <p>Instance Method</p>
    <h1>apply(_:to:)</h1>
    <p>Applies the given patch onto the given JSON data.</p>
    <pre>
        <code>func apply(_ patch: JSONPatch, to jsonData: Data) throws -&gt; Data</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>patch</dt>
    <dd>
        <p>The patch to apply.</p>
    </dd>
    <dt>jsonData</dt>
    <dd>
        <p>The data on which to apply the patch.</p>
    </dd>
</dl>
<h2>Return Value</h2>
<p>The JSON data with the patch applied.</p>
