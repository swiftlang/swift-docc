    <p>Initializer</p>
    <h1>init(info:baseURL:symbolGraphURLs:markupURLs:miscResourceURLs:customHeader:customFooter:themeSettings:customFavicon:)</h1>
    <p>Creates a new collection of build inputs for a unit of documentation.</p>
    <pre>
        <code>init(info: Info, baseURL: URL = URL(string: "/")!, symbolGraphURLs: [URL], markupURLs: [URL], miscResourceURLs: [URL], customHeader: URL? = nil, customFooter: URL? = nil, themeSettings: URL? = nil, customFavicon: URL? = nil)</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>info</dt>
    <dd>
        <p>Non-content information or metadata about this unit of documentation.</p>
    </dd>
    <dt>baseURL</dt>
    <dd>
        <p>A URL prefix to be appended to the relative presentation URL.</p>
    </dd>
    <dt>symbolGraphURLs</dt>
    <dd>
        <p>Symbol graph JSON input files for the module that’s represented by this unit of documentation.</p>
    </dd>
    <dt>markupURLs</dt>
    <dd>
        <p>Documentation markup input files for this unit of documentation.</p>
    </dd>
    <dt>miscResourceURLs</dt>
    <dd>
        <p>Miscellaneous resources (for example images, videos, or downloadable assets) for this unit of documentation.</p>
    </dd>
    <dt>customHeader</dt>
    <dd>
        <p>A custom HTML file to use as the header for rendered output.</p>
    </dd>
    <dt>customFooter</dt>
    <dd>
        <p>A custom HTML file to use as the footer for rendered output.</p>
    </dd>
    <dt>themeSettings</dt>
    <dd>
        <p>A custom JSON settings file used to theme renderer output.</p>
    </dd>
    <dt>customFavicon</dt>
    <dd>
        <p>A custom favicon file to use for rendered output.</p>
    </dd>
</dl>
