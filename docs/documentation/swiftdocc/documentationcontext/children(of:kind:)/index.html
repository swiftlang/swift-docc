    <hgroup>
      <p>Instance Method</p>
      <h1>children(of:kind:)</h1>
    </hgroup>
    <p>
      Fetch the child nodes of a documentation node with the given <code>reference</code>, optionally filtering to only children of the given <code>kind</code>.
    </p>
    <pre><code>func children(of reference: ResolvedTopicReference, kind: DocumentationNode.Kind? = nil) -> [(reference: ResolvedTopicReference, kind: DocumentationNode.Kind)]</code></pre>
  </section>
  <h2>Parameters</h2>
  <dl>
    <dt>reference</dt>
    <dd>
      <p>The reference of the node to fetch children for.</p>
    </dd>
    <dt>kind</dt>
    <dd>
      <p>An optional documentation node kind to filter the children by.</p>
    </dd>
  </dl>
  <h2>Return Value</h2>
  <p>A list of the reference and kind for each matching child node.</p>
  <h2>Discussion</h2>
  <aside class="important">
    <p class="label">
      Important
    </p>
    <p>The returned list can’t be used to determine source language specific children.</p>
  </aside>
