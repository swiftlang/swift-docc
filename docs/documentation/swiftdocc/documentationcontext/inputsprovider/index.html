  <h2>Overview</h2>
  <p>
    The inputs provider discovers documentation catalogs on the file system and creates a 
    <a href="../inputs/index.html">
      <code>DocumentationContext.Inputs</code>
    </a>
     from the discovered catalog content.
  </p>
