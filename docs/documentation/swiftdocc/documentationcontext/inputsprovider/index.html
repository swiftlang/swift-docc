    <h1>DocumentationContext.InputsProvider</h1>
    <p>A type that provides inputs for a unit of documentation.</p>
    <pre>
        <code>struct InputsProvider</code>
    </pre>
</section>
<h2>Mentioned In</h2>
<ul>
    <li>
        <a href="../../compilerpipeline/index.html">The Swift-DocC Pipeline</a>
    </li>
</ul>
<h2>Overview</h2>
<p>The inputs provider discovers documentation catalogs on the file system and creates a <a href="../../documentationbundle/index.html">
        <code>DocumentationBundle</code>
    </a>
     from the discovered catalog content.</p>
<p>The input provider categorizes the catalog content based on corresponding <a href="../../documentationbundlefiletypes/index.html">
        <code>DocumentationBundleFileTypes</code>
    </a>
     conditions:</p>
<table>
    <thead>
        <tr>
            <th>Category</th>
            <th>Condition</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>
                <code>markupURLs</code>
            </td>
            <td>
                <code>isMarkupFile(_:)</code>
            </td>
        </tr>
        <tr>
            <td>
                <code>symbolGraphURLs</code>
            </td>
            <td>
                <code>isSymbolGraphFile(_:)</code>
            </td>
        </tr>
        <tr>
            <td>
                <code>info</code>
            </td>
            <td>
                <code>isInfoPlistFile(_:)</code>
            </td>
        </tr>
        <tr>
            <td>
                <code>themeSettings</code>
            </td>
            <td>
                <code>isThemeSettingsFile(_:)</code>
            </td>
        </tr>
        <tr>
            <td>
                <code>customHeader</code>
            </td>
            <td>
                <code>isCustomHeader(_:)</code>
            </td>
        </tr>
        <tr>
            <td>
                <code>customFooter</code>
            </td>
            <td>
                <code>isCustomFooter(_:)</code>
            </td>
        </tr>
        <tr>
            <td>
                <code>customFavicon</code>
            </td>
            <td>
                <code>isCustomFavicon(_:)</code>
            </td>
        </tr>
        <tr>
            <td>
                <code>miscResourceURLs</code>
            </td>
            <td>Any file not already matched above.</td>
        </tr>
    </tbody>
</table>

<p>Discover documentation build inputs from a mix of discovered documentation catalogs and other command line options.</p>

        </a>
        <p>Traverses the file system from the given starting point to find a documentation catalog and creates a collection of documentation inputs from that catalog.</p>
