    <p>Instance Method</p>
    <h1>inputsAndDataProvider(startingPoint:allowArbitraryCatalogDirectories:options:)</h1>
    <p>Traverses the file system from the given starting point to find a documentation catalog and creates a collection of documentation inputs from that catalog.</p>
    <pre>
        <code>func inputsAndDataProvider(startingPoint: URL?, allowArbitraryCatalogDirectories: Bool = false, options: Options) throws -&gt; InputsAndDataProvider</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>startingPoint</dt>
    <dd>
        <p>The top of the directory hierarchy that the provider traverses to find a documentation catalog.</p>
    </dd>
    <dt>allowArbitraryCatalogDirectories</dt>
    <dd>
        <p>Whether to treat the starting point as a documentation catalog if the provider doesn’t find an actual catalog on the file system.</p>
    </dd>
    <dt>options</dt>
    <dd>
        <p>Options to configure how the provider creates the documentation inputs.</p>
    </dd>
</dl>
<h2>Return Value</h2>
<p>A pair of documentation inputs and a corresponding data provider for those input files.</p>
<h2>Discussion</h2>
<p>If the provider can’t find a catalog, it will try to create documentation inputs from the option’s symbol graph files.</p>
<p>If the provider can’t create documentation inputs it will raise an error with high level suggestions on how the caller can provide the missing information.</p>
