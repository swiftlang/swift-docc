    <p>Type Method</p>
    <h1>isFileExtension(_:supported:)</h1>
    <p>Checks if a given <code>fileExtension</code>
         is supported as a <code>type</code>
         of asset.</p>
    <pre>
        <code>static func isFileExtension(_ fileExtension: String, supported type: AssetType) -&gt; Bool</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>fileExtension</dt>
    <dd>
        <p>The file extension to check.</p>
    </dd>
    <dt>type</dt>
    <dd>
        <p>The type of asset to check if the <code>fileExtension</code>
             is supported for.</p>
    </dd>
</dl>
<h2>Return Value</h2>
<p>Whether or not the file extension is supported for the given type of asset.</p>
