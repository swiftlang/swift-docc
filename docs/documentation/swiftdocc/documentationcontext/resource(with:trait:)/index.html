    <p>Instance Method</p>
    <h1>resource(with:trait:)</h1>
    <p>Look for a secondary resource among the registered bundles.</p>
    <pre>
        <code>func resource(with identifier: ResourceReference, trait: DataTraitCollection = .init()) throws -&gt; Data</code>
    </pre>
</section>
<h2>Return Value</h2>
<p>A <code>Foundation.Data</code>
     object with the data for the given <a href="../../resourcereference/index.html">
        <code>ResourceReference</code>
    </a>
    .</p>
<h2>Discussion</h2>
<p>The context tracks resources by file name. If the documentation author specified a resource reference using a qualified path, instead of a file name, the context will fail to find that resource.</p>
<blockquote class="aside throws">
    <p class="label">Throws</p>
    <p><a href="../contexterror/notfound(_:)/index.html">
            <code>DocumentationContext.ContextError.notFound(_:)</code>
        </a>
         if a resource with the given was not found.</p>
</blockquote>
