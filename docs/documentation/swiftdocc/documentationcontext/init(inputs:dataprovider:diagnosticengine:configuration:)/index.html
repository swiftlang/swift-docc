    <p>Initializer</p>
    <h1>init(inputs:dataProvider:diagnosticEngine:configuration:)</h1>
    <p>Initializes a documentation context with a given <code>bundle</code>
        .</p>
    <pre>
        <code>init(inputs: DocumentationContext.Inputs, dataProvider: any DataProvider, diagnosticEngine: DiagnosticEngine = .init(), configuration: Configuration = .init()) async throws</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>inputs</dt>
    <dd>
        <p>The inputs to register with the context.</p>
    </dd>
    <dt>diagnosticEngine</dt>
    <dd>
        <p>The pre-configured engine that will collect diagnostics encountered during compilation.</p>
    </dd>
    <dt>configuration</dt>
    <dd>
        <p>A collection of configuration for the created context.</p>
    </dd>
</dl>
<h2>Discussion</h2>
<blockquote class="aside throws">
    <p class="label">Throws</p>
    <p>If an error is encountered while registering a documentation bundle.</p>
</blockquote>
