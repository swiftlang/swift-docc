    <hgroup>
      <p>Initializer</p>
      <h1>init(inputs:dataProvider:diagnosticEngine:configuration:)</h1>
    </hgroup>
    <p>Initializes a documentation context from a collection of input files.</p>
    <pre><code>init(inputs: DocumentationContext.Inputs, dataProvider: any DataProvider, diagnosticEngine: DiagnosticEngine = .init(), configuration: Configuration = .init()) async throws</code></pre>
  </section>
  <h2>Parameters</h2>
  <dl>
    <dt>inputs</dt>
    <dd>
      <p>The collection of input files to register with the context.</p>
    </dd>
    <dt>dataProvider</dt>
    <dd>
      <p>The data provider that the context uses to read files from the inputs.</p>
    </dd>
    <dt>diagnosticEngine</dt>
    <dd>
      <p>The pre-configured engine that will collect diagnostics encountered during compilation.</p>
    </dd>
    <dt>configuration</dt>
    <dd>
      <p>A collection of configuration for the created context.</p>
    </dd>
  </dl>
  <h2>Discussion</h2>
  <aside class="throws">
    <p class="label">
      Throws
    </p>
    <p>If an error is encountered while registering the documentation input files.</p>
  </aside>
