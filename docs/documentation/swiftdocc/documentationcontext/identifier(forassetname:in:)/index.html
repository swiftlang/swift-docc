    <p>Instance Method</p>
    <h1>identifier(forAssetName:in:)</h1>
    <p>Finds the identifier for a given asset name.</p>
    <pre>
        <code>func identifier(forAssetName name: String, in parent: ResolvedTopicReference) -&gt; String?</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>name</dt>
    <dd>
        <p>The name of the asset.</p>
    </dd>
    <dt>parent</dt>
    <dd>
        <p>The topic where the asset is referenced.</p>
    </dd>
</dl>
<h2>Return Value</h2>
<p>The best matching storage key if it was found, otherwise <code>nil</code>
    .</p>
<h2>Discussion</h2>
<p>
    <code>name</code>
     is one of the following formats:</p>
<ul>
    <li>
        <p>“image” - asset name without extension</p>
    </li>
    <li>
        <p>“image.png” - asset name including extension</p>
    </li>
</ul>
