    <h1>Persisting Documentation</h1>
    <p>Save compiled documentation to disk.</p>
</section>
<h2>Overview</h2>
<p>Once the in-memory documentation model is finalized each of its graph nodes can be converted to a rendering node and persisted on disk or elsewhere via the <code>Codable</code>
     protocol.</p>
<p>The <a href="../documentationnodeconverter/index.html">
        <code>DocumentationNodeConverter</code>
    </a>
     type converts documentation nodes to rendering nodes:</p>
<pre class="swift">
    <code>let converter = DocumentationNodeConverter(context: myContext)
let renderNode = converter.convert(documentationNode)
</code>
</pre>
<p>The render nodes can be persisted on disk as JSON files via <code>JSONEncodingRenderNodeWriter</code>
    :</p>
<pre class="swift">
    <code>let writer = JSONEncodingRenderNodeWriter(targetFolder: outputURL, 
    fileManager: FileManager.default)
try writer.write(renderNode)
</code>
</pre>
<p>The precise path inside the output folder where resulting JSON file is saved is automatically determined by the node type (article, symbol reference, etc.).</p>
