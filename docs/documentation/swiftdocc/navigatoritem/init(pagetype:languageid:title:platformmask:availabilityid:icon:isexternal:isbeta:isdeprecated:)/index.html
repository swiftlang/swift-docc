    <p>Initializer</p>
    <h1>init(pageType:languageID:title:platformMask:availabilityID:icon:isExternal:isBeta:isDeprecated:)</h1>
    <p>Initialize a <code>NavigatorItem</code>
         with the given data.</p>
    <pre>
        <code>init(pageType: UInt8, languageID: UInt8, title: String, platformMask: UInt64, availabilityID: UInt64, icon: RenderReferenceIdentifier? = nil, isExternal: Bool = false, isBeta: Bool = false, isDeprecated: Bool = false)</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>pageType</dt>
    <dd>
        <p>The type of the page, such as “article”, “tutorial”, “struct”, etc…</p>
    </dd>
    <dt>languageID</dt>
    <dd>
        <p>The numerical identifier of the language.</p>
    </dd>
    <dt>title</dt>
    <dd>
        <p>The user facing page title.</p>
    </dd>
    <dt>platformMask</dt>
    <dd>
        <p>The mask indicating for which platform the page is available.</p>
    </dd>
    <dt>availabilityID</dt>
    <dd>
        <p>The identifier of the availability information of the page.</p>
    </dd>
    <dt>icon</dt>
    <dd>
        <p>A reference to a custom image for this navigator item.</p>
    </dd>
    <dt>isExternal</dt>
    <dd>
        <p>A flag indicating whether the navigator item belongs to an external documentation archive.</p>
    </dd>
    <dt>isBeta</dt>
    <dd>
        <p>A flag indicating whether the navigator item is in beta.</p>
    </dd>
    <dt>isDeprecated</dt>
    <dd>
        <p>A flag indicating whether the navigator item is deprecated.</p>
    </dd>
</dl>
