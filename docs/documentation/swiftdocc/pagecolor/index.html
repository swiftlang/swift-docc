    <p>Class</p>
    <h1>PageColor</h1>
    <p>A directive that specifies an accent color for a given documentation page.</p>
    <pre>
        <code>final class PageColor</code>
    </pre>
</section>
<h2>Overview</h2>
<p>Use the <code>PageColor</code>
     directive to provide a hint to the renderer as to how the page should be accented with color. The renderer may use this color, depending on the context, as a foundation for other colors used on the page. For example, Swift-DocC-Render uses this color as the primary background color of a page’s introduction section and adjusts other elements in the introduction section to account for the new background.</p>
<p>This directive is only valid within a <a href="../metadata/index.html">
        <code>Metadata</code>
    </a>
     directive:</p>
<pre class="markdown">
    <code>@Metadata {
    @PageColor(orange)
}
</code>
</pre>
