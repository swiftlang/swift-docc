    <hgroup>
      <p>Function</p>
      <h1>autoreleasepool(_:)</h1>
    </hgroup>
    <p>A shim for non-ObjC targets that runs the given block of code.</p>
    <pre><code>@discardableResult func autoreleasepool&lt;Result>(_ block: () throws -> Result) rethrows -> Result</code></pre>
  </section>
  <h2>Discussion</h2>
  <p>
    The existence of this shim allows you the use of auto-release pools to optimize memory footprint on Darwin platforms while maintaining compatibility with Linux where this API is not implemented.
  </p>
