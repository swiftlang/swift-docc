    <h1>NoOpSignposterShim</h1>
    <p>A shim for <code>os.OSSignposter</code>
         that does nothing, except for running the passed interval task.</p>
    <pre>
        <code>struct NoOpSignposterShim</code>
    </pre>
</section>
<h2>Overview</h2>
<p>This type allows calling code to avoid using <code>#if canImport(os)</code>
     throughout the implementation.</p>
