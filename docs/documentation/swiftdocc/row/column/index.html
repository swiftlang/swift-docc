    <p>Class</p>
    <h1>Row.Column</h1>
    <p>A container directive that holds general markup content describing a column with a row in a grid-based layout.</p>
    <pre>
        <code>final class Column</code>
    </pre>
</section>
<h2>Overview</h2>
<p>Create a column inside a <a href="../index.html">
        <code>Row</code>
    </a>
     by nesting a <code>@Column</code>
     directive within the content for an <code>@Row</code>
     directive. Use <code>size</code>
     to span multiple columns and <code>alignment</code>
     to control content positioning.</p>
<pre class="md">
    <code>@Row {
    @Column {
        Default (leading) alignment
    }

    @Column(alignment: center) {
        Centered content
    }

    @Column(size: 2, alignment: trailing) {
        Trailing alignment; twice as wide
    }
}
</code>
</pre>
<blockquote class="aside earlier versions">
    <p class="label">Earlier Versions</p>
    <p> Before Swift-DocC 6.4, the <code>alignment</code>
         parameter wasn’t supported for <code>@Column</code>
        .</p>
</blockquote>
