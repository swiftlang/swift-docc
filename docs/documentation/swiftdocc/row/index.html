    <p>Class</p>
    <h1>Row</h1>
    <p>A container directive that arranges content into a grid-based row and column layout.</p>
    <pre>
        <code>final class Row</code>
    </pre>
</section>
<h2>Overview</h2>
<p>Create a new row by creating an <code>@Row</code>
     that contains child <code>@Column</code>
     directives.</p>
<pre class="md">
    <code>@Row {
   @Column {
      @Image(source: "icon-power-icon", alt: "A blue square containing a snowflake.") {
         Ice power
      }
   }

   @Column {
      @Image(source: "fire-power-icon", alt: "A red square containing a flame.") {
         Fire power
      }
   }

   @Column {
      @Image(source: "wind-power-icon", alt: "A teal square containing a breath of air.") {
         Wind power
      }
   }

   @Column {
      @Image(source: "lightning-power-icon", alt: "A yellow square containing a lightning bolt.") {
         Lightning power
      }
   }
}
</code>
</pre>
