    <hgroup>
      <p>Initializer</p>
      <h1>init(from:source:for:featureFlags:diagnostics:)</h1>
    </hgroup>
    <p>Creates a semantic object from the parsed block directive markup and performs semantic analysis to verify that the semantic object is valid.</p>
    <pre><code>init?(from directive: BlockDirective, source: URL?, for inputs: DocumentationContext.Inputs, featureFlags: FeatureFlags, diagnostics: inout [Diagnostic])</code></pre>
  </section>
  <h2>Parameters</h2>
  <dl>
    <dt>directive</dt>
    <dd>
      <p>The parsed block directive to create a semantic object from.</p>
    </dd>
    <dt>source</dt>
    <dd>
      <p>The location of the source file that contains the markup for the parsed block directive.</p>
    </dd>
    <dt>inputs</dt>
    <dd>
      <p>The collection of build inputs that the source file belongs to.</p>
    </dd>
    <dt>featureFlags</dt>
    <dd>
      <p>A collection of feature flags.</p>
    </dd>
    <dt>diagnostics</dt>
    <dd>
      <p>A mutable collection of diagnostics to update with any additional issues encountered while initializing the directive.</p>
    </dd>
  </dl>
