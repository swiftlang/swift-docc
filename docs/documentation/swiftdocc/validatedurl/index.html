      <h1>ValidatedURL</h1>
    </hgroup>
    <p>An RFC 3986 compliant URL.</p>
    <pre><code>struct ValidatedURL</code></pre>
  </section>
  <h2>Overview</h2>
  <p>
    Use this wrapper type to make sure your stored URLs comply to RFC 3986 that <code>URLComponents</code> implements, rather than the less- strict implementation of <code>URL</code>.
  </p>
  <p>
    For example, due to older RFC compliance, <code>URL</code> fails to parse relative topic references with a fragment like this:
  </p>
  <ul>
    <li>
      <p>
        <code>URL(string: "doc:tutorial#test")?.fragment</code> -> <code>nil</code>
      </p>
    </li>
    <li>
      <p>
        <code>URLComponents(string: "doc:tutorial#test")?.fragment</code> -> <code>"test"</code>
      </p>
    </li>
  </ul>
  <h2>Topics</h2>

        <code>var components: URLComponents</code>
      </a>
      <p>The raw components that make up the validated URL.</p>
    </li>
  </ul>
