    <h1>init(identifier:fileName:fileType:syntax:content:highlights:)</h1>
    <p>Creates a new file reference.</p>
    <pre>
        <code>init(identifier: RenderReferenceIdentifier, fileName: String, fileType: String, syntax: String, content: [String], highlights: [LineHighlighter.Highlight] = [])</code>
    </pre>
