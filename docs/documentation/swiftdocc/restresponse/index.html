    <h1>RESTResponse</h1>
    <p>A REST response that includes the HTTP status, reason, and the MIME type encoding of the response body.</p>
    <pre>
        <code>struct RESTResponse</code>

<h2>Overview</h2>
<p>If the response is a decodable object, a declaration-style <code>type</code>
     property describes the expected type and can provide an optional link to the expected documentation symbol.</p>
