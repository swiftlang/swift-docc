      <h1>requestCodeColors(identifier:)</h1>
    </hgroup>
    <p>Creates a message that indicates a request for code-color preferences.</p>
    <pre><code>static func requestCodeColors(identifier: String = generateUUID()) -> Message</code></pre>
  </section>
  <h2>Discussion</h2>
  <p>
    This message is sent by renderer to request code-color preferences that renderers use when syntax highlighting code listings. The string value of this message type is <code>requestCodeColors</code>.
  </p>
