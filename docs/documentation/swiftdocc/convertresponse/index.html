    <h1>ConvertResponse</h1>
    <p>A response for a successful documentation conversion.</p>
    <pre>
        <code>struct ConvertResponse</code>
    </pre>
</section>
<h2>Overview</h2>
<p>This response is sent by a <a href="../convertservice/index.html">
        <code>ConvertService</code>
    </a>
     if the conversion was successful. If the conversion was not successful, a <a href="../convertserviceerror/index.html">
        <code>ConvertServiceError</code>
    </a>
     is returned instead.</p>
