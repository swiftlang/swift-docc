    <h1>init(title:path:type:children:isDeprecated:isExternal:isBeta:icon:)</h1>
    <p>Creates a new node with the given title, path, type, and children.</p>
    <pre>
        <code>init(title: String, path: String?, type: String?, children: [Node]?, isDeprecated: Bool, isExternal: Bool, isBeta: Bool, icon: RenderReferenceIdentifier? = nil)</code>
    </pre>
</section>

<dl>

    <dd>
        <p>The title of the node, suitable for presentation.</p>
    </dd>
    <dt>path</dt>
    <dd>
        <p>The relative path to the page represented by this node.</p>
    </dd>
    <dt>type</dt>
    <dd>
        <p>The type of this node.</p>
