    <h1>RenderIndex</h1>
    <p>A navigation index of the content in a DocC archive, optimized for rendering.</p>
    <pre>
        <code>struct RenderIndex</code>
    </pre>
</section>
<h2>Overview</h2>
<p>The structure of this data is determined by the topic groups authored in the processed documentation content.</p>
<p>This is an alternative representation of the data that is also handled by the <a href="../navigatorindex/index.html">
        <code>NavigatorIndex</code>
    </a>
     in a <a href="../navigatortree/index.html">
        <code>NavigatorTree</code>
    </a>
    . This index is specifically designed to be emitted to disk as JSON file and implements the RenderIndex JSON spec.</p>
<p>An OpenAPI specification for RenderIndex is available in the repo at <code>Sources/SwiftDocC/SwiftDocC.docc/Resources/RenderIndex.spec.json</code>
    .</p>
