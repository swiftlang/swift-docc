    <hgroup>
      <p>Instance Method</p>
      <h1>register(provider:subPath:)</h1>
    </hgroup>
    <p>
      Registers a <code>FileServerProvider</code> to a <code>FileServer</code> objects which can be used to provide content to a local web page served by local content.
    </p>
    <pre><code>@discardableResult func register(provider: any FileServerProvider, subPath: String = "/") -> Bool</code></pre>
  </section>
  <h2>Parameters</h2>
  <dl>
    <dt>provider</dt>
    <dd>
      <p>
        An object conforming to <code>FileServerProvider</code>.
      </p>
    </dd>
    <dt>subPath</dt>
    <dd>
      <p>
        The sub-path in which the <code>FileServerProvider</code> will be queried for content.
      </p>
    </dd>
  </dl>
  <h2>Return Value</h2>
  <p>A boolean indicating if the registration succeeded or not.</p>
