    <h1>FileServer</h1>
    <p>FileServer is a struct simulating a web server behavior to serve files. It is useful to interface a custom schema with <code>WKWebView</code>
         via <code>WKURLSchemeHandler</code>
         or <code>WebView</code>
         via a custom <code>URLProtocol</code>
        .</p>
