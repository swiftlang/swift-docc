      <p>Class</p>
      <h1>DeprecationSummary</h1>
    </hgroup>
    <p>A directive that specifies a custom deprecation summary message to an already deprecated symbol.</p>
    <pre><code>final class DeprecationSummary</code></pre>
  </section>
  <h2>Overview</h2>
  <p>
    Many in-source deprecation annotations—such as the <code>@available</code> attribute in Swift—allow you to specify a plain text deprecation message. You can use the <code>@DeprecationSummary</code> directive to override that deprecation message with one or more paragraphs of formatted documentation markup. For example,
  </p>
  <pre class="md"><code>@DeprecationSummary {
    This method is unsafe because it could potentially cause buffer overruns.
    Use ``getBytes(_:length:)`` or ``getBytes(_:range:)`` instead.
}
</code></pre>
  <p>
    You can use the <code>@DeprecationSummary</code> directive top-level in articles, documentation extension files, or documentation comments.
  </p>
  <aside class="earlier versions">
    <p class="label">
      Earlier versions
    </p>
    <p>
      Before Swift-DocC 6.1, <code>@DeprecationSummary</code> was not supported in documentation comments.
    </p>
  </aside>
  <aside class="tip">
    <p class="label">
      Tip
    </p>
    <p>
       If you are writing a custom deprecation summary message for an API or documentation page that isn’t already deprecated, you should also deprecate it—using in-source annotations when possible or <code>Available</code> directives when in-source annotations aren’t available—so that the reader knows the version when you deprecated that API or documentation page.
    </p>
  </aside>
