      <h1>DefaultAvailability</h1>
    </hgroup>
    <p>A collection of modules and the default platform availability for symbols in that module.</p>
    <pre><code>struct DefaultAvailability</code></pre>
  </section>
  <h2>Overview</h2>
  <p>Default availability is used as a fallback value for symbols without explicit availability information.</p>
  <p>
    This information can be authored in the catalog’s Info.plist file, as a dictionary of module names to arrays of platform “name” and “version” pairs, or in the case where the platform in unconditionally unavailable, “name” and “unavailable” pairs:
  </p>
  <pre><code>&lt;key>CDAppleDefaultAvailability&lt;/key>
&lt;dict>
    &lt;key>Module Name&lt;/key>
    &lt;array>
        &lt;dict>
            &lt;key>name&lt;/key>
            &lt;string>Platform Name&lt;/string>
            &lt;key>version&lt;/key>
            &lt;string>Version Number&lt;/string>
        &lt;/dict>
        &lt;dict>
            &lt;key>name&lt;/key>
            &lt;string>Platform Name&lt;/string>
        &lt;/dict>
        &lt;dict>
            &lt;key>name&lt;/key>
            &lt;string>Other Platform Name&lt;/string>
            &lt;key>unavailable&lt;/key>
            &lt;true/>
        &lt;/dict>
    &lt;/array>
&lt;/dict>
</code></pre>
