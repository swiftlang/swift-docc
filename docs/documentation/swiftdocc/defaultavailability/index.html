    <p>Structure</p>
    <h1>DefaultAvailability</h1>
    <p>A collection of modules and the default platform availability for symbols in that module.</p>
    <pre>
        <code>struct DefaultAvailability</code>
    </pre>
</section>
<h2>Overview</h2>
<p>Default availability is used as a fallback value for symbols without explicit availability information.</p>
<p>This information can be authored in the catalog’s Info.plist file, as a dictionary of module names to arrays of platform “name” and “version” pairs, or in the case where the platform in unconditionally unavailable, “name” and “unavailable” pairs:</p>
<pre>
    <code>&lt;key&gt;CDAppleDefaultAvailability&lt;/key&gt;
&lt;dict&gt;
    &lt;key&gt;Module Name&lt;/key&gt;
    &lt;array&gt;
        &lt;dict&gt;
            &lt;key&gt;name&lt;/key&gt;
            &lt;string&gt;Platform Name&lt;/string&gt;
            &lt;key&gt;version&lt;/key&gt;
            &lt;string&gt;Version Number&lt;/string&gt;
        &lt;/dict&gt;
        &lt;dict&gt;
            &lt;key&gt;name&lt;/key&gt;
            &lt;string&gt;Platform Name&lt;/string&gt;
        &lt;/dict&gt;
        &lt;dict&gt;
            &lt;key&gt;name&lt;/key&gt;
            &lt;string&gt;Other Platform Name&lt;/string&gt;
            &lt;key&gt;unavailable&lt;/key&gt;
            &lt;true/&gt;
        &lt;/dict&gt;
    &lt;/array&gt;
&lt;/dict&gt;
</code>
</pre>
