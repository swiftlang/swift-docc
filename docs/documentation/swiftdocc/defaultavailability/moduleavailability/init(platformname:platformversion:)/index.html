      <h1>init(platformName:platformVersion:)</h1>
    </hgroup>
    <p>Creates a new module availability with a given platform name and platform version.</p>
    <pre><code>init(platformName: PlatformName, platformVersion: String?)</code></pre>
  </section>
  <h2>Parameters</h2>
  <dl>
    <dt>platformName</dt>
    <dd>
      <p>
        A platform name, such as “iOS” or “macOS”; see 
        <a href="../../../platformname/index.html">
          <code>PlatformName</code>
        </a>
        .
      </p>
    </dd>
    <dt>platformVersion</dt>
    <dd>
      <p>
        A 2- or 3-component version string, such as <code>"13.0"</code> or <code>"13.1.2"</code>.
      </p>
