    <hgroup>
      <p>Initializer</p>
      <h1>init(filterLevel:treatWarningsAsErrors:diagnosticIDsWithWarningSeverity:diagnosticIDsWithErrorSeverity:)</h1>
    </hgroup>
    <p>Creates a new diagnostic engine instance with no consumers.</p>
    <pre><code>init(filterLevel: DiagnosticSeverity = .warning, treatWarningsAsErrors: Bool = false, diagnosticIDsWithWarningSeverity: Set&lt;String> = [], diagnosticIDsWithErrorSeverity: Set&lt;String> = [])</code></pre>
  </section>
  <h2>Parameters</h2>
  <dl>
    <dt>filterLevel</dt>
    <dd>
      <p>The lowest severity (inclusive) that the engine emits to its consumers.</p>
    </dd>
    <dt>treatWarningsAsErrors</dt>
    <dd>
      <p>
        A Boolean value indicating whether the engine raises the severity of warnings to “error” (unless <code>warningGroupsWithWarningSeverity</code> explicitly lowers the severity of that diagnostic to a warning)
      </p>
    </dd>
    <dt>diagnosticIDsWithWarningSeverity</dt>
    <dd>
      <p>A list of diagnostic identifiers that are explicitly lowered to a “warning” severity.</p>
    </dd>
    <dt>diagnosticIDsWithErrorSeverity</dt>
    <dd>
      <p>A list of diagnostic identifiers that are explicitly raised to an “error” severity.</p>
    </dd>
  </dl>
