    <hgroup>
      <p>Instance Method</p>
      <h1>hasConsumer(matching:)</h1>
    </hgroup>
    <p>Returns a Boolean value indicating whether the engine contains a consumer that satisfies the given predicate.</p>
    <pre><code>func hasConsumer(matching predicate: (any DiagnosticConsumer) throws -> Bool) rethrows -> Bool</code></pre>
  </section>
  <h2>Parameters</h2>
  <dl>
    <dt>predicate</dt>
    <dd>
      <p>A closure that takes one of the engine’s consumers as its argument and returns a Boolean value that indicates whether the passed consumer represents a match.</p>
    </dd>
  </dl>
  <h2>Return Value</h2>
  <p>
    <code>true</code> if the engine contains a consumer that satisfies predicate; otherwise, <code>false</code>.
  </p>
