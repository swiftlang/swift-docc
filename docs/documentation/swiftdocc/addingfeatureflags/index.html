    <h1>Adding Feature Flags</h1>
    <p>Develop experimental features by adding feature flags.</p>
</section>
<h2>Overview</h2>
<p>Make new features in Swift-DocC optional during active development by creating a command-line flag that enables the new behavior. Then pass a <a href="../featureflags/index.html">
        <code>FeatureFlags</code>
    </a>
     value, or just one of its properties, to the code that needs to check that feature flag.</p>
<h3>The FeatureFlags structure</h3>
<p>Feature flags are defined in the <a href="../featureflags/index.html">
        <code>FeatureFlags</code>
    </a>
     structure. When adding a flag property to this structure, specify a default value on the property instead of adding a parameters to the only (parameterless) initializer. This way, a feature flag value created using <code>FeatureFlags()</code>
     has all flags set to their default values.</p>
<h3>Feature flags on the command line</h3>
<p>Command-line feature flags live in the <code>Docc.Convert.FeatureFlagOptions</code>
     in <code>DocCCommandLine</code>
    . This type implements the <code>ParsableArguments</code>
     protocol from Swift Argument Parser to create an option group for the <code>convert</code>
     and <code>preview</code>
     commands.</p>
<p>
    <code>ConvertAction.init(fromConvertCommand:)</code>
    , still in <code>DocCCommandLine</code>
    , then transforms these parsed flags into a <code>FeatureFlags</code>
     value. The <code>ConvertAction</code>
     stores the newly created feature flags in the <a href="../documentationcontext/configuration-swift.struct/featureflags/index.html">
        <code>featureFlags</code>
    </a>
     property of its <code>configuration</code>
    . The <code>ConvertAction</code>
     uses this configuration, and its feature flag information, to create the <a href="../documentationcontext/index.html">
        <code>DocumentationContext</code>
    </a>
     which passes the feature flags to all the places that need to check them.</p>
<h3>Feature flags in Info.plist</h3>
<p>Some documentation is authored with the expectation that it’s always built with certain feature flags enabled and may not look or behave as intended without those flags. For example, documentation that’s organized based on the experimental overloaded symbol presentation flag can have a rather different organization without that flag, making it harder for readers to navigate the documentation and find related API.</p>
<p>If you add a feature flag like this, you should also add a corresponding flag to the <code>BundleFeatureFlags</code>
     type, so that flag can be specified from a documentation catalog’s Info.plist. The value from the catalog’s Info.plist overrides any value that the developer may specify using a command line flag.</p>
<p>The <a href="../documentationcontext/index.html">
        <code>DocumentationContext</code>
    </a>
     calls the <code>loadFlagsFromBundle(_:)</code>
     method to override the feature flags it got from the convert action with those decoded from the Info.plist. Update this method to ensure that your new flag properly overrides the values from the convert action.</p>
