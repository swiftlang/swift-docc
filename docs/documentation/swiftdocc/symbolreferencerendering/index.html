    <p>API Collection</p>
    <h1>Symbol Reference Rendering</h1>
    <p>Render rich reference documentation for programming symbols.</p>
</section>
<h2>Overview</h2>
<p>Each section in a rendering node represents a piece of data potentially rendered on a documentation page.</p>
<p>A documentation abstract is represented by a <a href="../abstractsection/index.html">
        <code>AbstractSection</code>
    </a>
    , a section listing the declarations on various platform for a symbol is represented by a <a href="../declarationsrendersection/index.html">
        <code>DeclarationsRenderSection</code>
    </a>
    , a See Also section by a <a href="../seealsosection/index.html">
        <code>SeeAlsoSection</code>
    </a>
    , and so on.</p>
<h2>Topics</h2>
<h3>Metadata</h3>
<ul>
    <li>
        <a href="../renderreferencehierarchy/index.html">
            <code>struct RenderReferenceHierarchy</code>
        </a>
        <p>A node that represents API symbol hierarchy.</p>
    </li>
</ul>
<h3>Main Sections</h3>
<ul>
    <li>
        <a href="../abstractsection/index.html">
            <code>struct AbstractSection</code>
        </a>
        <p>A one-paragraph section that represents a symbol’s abstract description.</p>
    </li>
    <li>
        <a href="../deprecatedsection/index.html">
            <code>struct DeprecatedSection</code>
        </a>
        <p>A section that contains deprecation information.</p>
    </li>
    <li>
        <a href="../declarationsrendersection/index.html">
            <code>struct DeclarationsRenderSection</code>
        </a>
        <p>A compound section that contains a list of declaration sections.</p>
    </li>
    <li>
        <a href="../declarationrendersection/index.html">
            <code>struct DeclarationRenderSection</code>
        </a>
        <p>A section that contains a symbol declaration.</p>
    </li>
    <li>
        <a href="../parameterssection/index.html">
            <code>struct ParametersSection</code>
        </a>
        <p>A section that contains a function’s parameters.</p>
    </li>
    <li>
        <a href="../returnssection/index.html">
            <code>struct ReturnsSection</code>
        </a>
        <p>A section that contains return value information for a function.</p>
    </li>
    <li>
        <a href="../discussionsection/index.html">
            <code>struct DiscussionSection</code>
        </a>
    </li>
    <li>
        <a href="../topicssection/index.html">
            <code>struct TopicsSection</code>
        </a>
        <p>A section that contains groups of symbols.</p>
    </li>
    <li>
        <a href="../seealsosection/index.html">
            <code>struct SeeAlsoSection</code>
        </a>
        <p>A section that contains groups of related symbols or external links.</p>
    </li>
    <li>
        <a href="../sampledownloadsection/index.html">
            <code>struct SampleDownloadSection</code>
        </a>
        <p>A section that contains download data for a sample project.</p>
    </li>
</ul>

<ul>
    <li>
        <a href="../relationshipsrendersection/index.html">
            <code>struct RelationshipsRenderSection</code>
        </a>

    </li>
    <li>
        <a href="../relationship/index.html">

        </a>

    </li>
    <li>
        <a href="../relationshipssection/index.html">
            <code>struct RelationshipsSection</code>
        </a>

    <li>
        <a href="../relationshipsgroup/index.html">

    <li>
        <a href="../defaultimplementationssection/index.html">
            <code>struct DefaultImplementationsSection</code>
        </a>

    <li>
        <a href="../implementationsgroup/index.html">

</ul>
