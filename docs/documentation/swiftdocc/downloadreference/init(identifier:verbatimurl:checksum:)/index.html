    <p>Initializer</p>
    <h1>init(identifier:verbatimURL:checksum:)</h1>
    <p>Creates a new reference to a downloadable resource, with a URL that should be encoded as-is.</p>
    <pre>
        <code>init(identifier: RenderReferenceIdentifier, verbatimURL url: URL, checksum: String?)</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>identifier</dt>
    <dd>
        <p>An identifier for the resource’s reference.</p>
    </dd>
    <dt>url</dt>
    <dd>
        <p>The path to the resource. This will be encoded as-is into the Render JSON.</p>
    </dd>
    <dt>checksum</dt>
    <dd>
        <p>The SHA512 hash value for the resource.</p>
    </dd>
</dl>
