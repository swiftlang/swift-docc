    <p>Instance Method</p>
    <h1>createFile(at:contents:)</h1>
    <p>Creates a file with the specified <code>contents</code>
         at the specified location.</p>
    <pre>
        <code>func createFile(at: URL, contents: Data) throws</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>at</dt>
    <dd>
        <p>The location to create the file</p>
    </dd>
    <dt>contents</dt>
    <dd>
        <p>The data to write to the file.</p>
    </dd>
</dl>
<h2>Discussion</h2>
<blockquote class="aside note">
    <p class="label">Note</p>
    <p>This method doesn’t exist on <code>FileManager</code>
        . There is a similar looking method but it doesn’t provide information about potential errors.</p>
</blockquote>
<blockquote class="aside throws">
    <p class="label">Throws</p>
