    <h1>FileManagerProtocol</h1>
    <p>A read-write file manager.</p>
    <pre>
        <code>protocol FileManagerProtocol : DataProvider</code>
    </pre>
</section>
<h2>Overview</h2>
<p>A file-system manager is a type that’s central to <i>managing</i>
     files on a file-system, it performs actions like creating new files, copying, renaming and deleting files, and organizing them in directories.</p>
<p>The Cocoa <code>FileManager</code>
     type is the default implementation of that protocol that manages files stored on disk.</p>
<p>Should you need a file system with a different storage, create your own protocol implementations to manage files in memory, on a network, in a database, or elsewhere.</p>
