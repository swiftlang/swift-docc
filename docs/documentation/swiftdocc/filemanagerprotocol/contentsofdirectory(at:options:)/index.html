    <hgroup>
      <p>Instance Method</p>
      <h1>contentsOfDirectory(at:options:)</h1>
    </hgroup>
    <p>Performs a shallow search of the specified directory and returns the file and directory URLs for the contained items.</p>
    <pre><code>func contentsOfDirectory(at url: URL, options mask: FileManager.DirectoryEnumerationOptions) throws -> (files: [URL], directories: [URL])</code></pre>
  </section>
  <h2>Parameters</h2>
  <dl>
    <dt>url</dt>
    <dd>
      <p>The URL for the directory whose contents to enumerate.</p>
    </dd>
    <dt>mask</dt>
    <dd>
      <p>
        Options for the enumeration. Because this method performs only shallow enumerations, the only supported option is <code>skipsHiddenFiles</code>.
      </p>
    </dd>
  </dl>
  <h2>Return Value</h2>
  <p>
    The URLs of each file and directory that’s contained in <code>url</code>.
  </p>
