    <h1>recursiveFiles(startingPoint:options:)</h1>
    <p>Returns a sequence of all the files in the directory structure from the starting point.</p>
    <pre>
        <code>func recursiveFiles(startingPoint: URL, options: FileManager.DirectoryEnumerationOptions = .skipsHiddenFiles) -&gt; IteratorSequence&lt;_FilesIterator&gt;</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>startingPoint</dt>
    <dd>
        <p>The file or directory that’s the top of the directory structure that the file manager traverses.</p>
    </dd>
    <dt>options</dt>
    <dd>
        <p>Options for how the file manager enumerates the contents of directories. Defaults to <code>.skipsHiddenFiles</code>
            .</p>
    </dd>
</dl>
<h2>Return Value</h2>
<p>A sequence of the files in the directory structure.</p>
