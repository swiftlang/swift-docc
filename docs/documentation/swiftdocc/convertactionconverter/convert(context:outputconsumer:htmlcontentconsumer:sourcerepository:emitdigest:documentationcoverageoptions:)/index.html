    <hgroup>
      <p>Type Method</p>
      <h1>convert(context:outputConsumer:htmlContentConsumer:sourceRepository:emitDigest:documentationCoverageOptions:)</h1>
    </hgroup>
    <p>Converts the documentation in the given context and passes its output to a given consumer.</p>
    <pre><code>static func convert(context: DocumentationContext, outputConsumer: some _WillBeMadeNonPublicConvertOutputConsumer &amp; ExternalNodeConsumer, htmlContentConsumer: (any HTMLContentConsumer)?, sourceRepository: SourceRepository?, emitDigest: Bool, documentationCoverageOptions: DocumentationCoverageOptions) async throws</code></pre>
  </section>
  <h2>Parameters</h2>
  <dl>
    <dt>context</dt>
    <dd>
      <p>The context that the bundle is a part of.</p>
    </dd>
    <dt>outputConsumer</dt>
    <dd>
      <p>The consumer that the conversion passes outputs of the conversion to.</p>
    </dd>
    <dt>htmlContentConsumer</dt>
    <dd>
      <p>
        The consumer for HTML content that the conversion produces, or <code>nil</code> if the conversion shouldn’t produce any HTML content.
      </p>
    </dd>
    <dt>sourceRepository</dt>
    <dd>
      <p>The source repository where the documentation’s sources are hosted.</p>
    </dd>
    <dt>emitDigest</dt>
    <dd>
      <p>Whether the conversion should pass additional metadata output––such as linkable entities information, indexing information, or asset references by asset type––to the consumer.</p>
    </dd>
    <dt>documentationCoverageOptions</dt>
    <dd>
      <p>The level of experimental documentation coverage information that the conversion should pass to the consumer.</p>
    </dd>
  </dl>
