    <h1>subheadingDeclarationFragments</h1>
    <p>The simplified “subheading” declaration fragments for this symbol, or <code>nil</code>
         if the summarized element isn’t a symbol.</p>

<h2>Discussion</h2>
<p>These subheading fragments are suitable to use to refer to a symbol that’s linked to in a topic group.</p>
<blockquote class="aside note">
    <p class="label">Note</p>
    <p>The subheading fragments do not represent the symbol’s full declaration. Different overloads may have indistinguishable subheading fragments.</p>
