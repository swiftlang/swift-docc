    <p>Structure</p>
    <h1>LinkDestinationSummary</h1>
    <p>A summary of an element that you can link to from outside the local documentation.</p>
    <pre>
        <code>struct LinkDestinationSummary</code>
    </pre>
</section>
<h2>Overview</h2>
<p>The non-optional properties of this summary are all the information needed when another unit of documentation references this element.</p>
<p>Various information from the summary is used depending on what content references the summarized element. For example:</p>
<ul>
    <li>
        <p>In a paragraph of text, a link to this element will use the <a href="title/index.html">
                <code>title</code>
            </a>
             as the link text and style the tile in code font if the <a href="kind/index.html">
                <code>kind</code>
            </a>
             is a type of symbol.</p>
    </li>
    <li>
        <p>In a task group, the <a href="title/index.html">
                <code>title</code>
            </a>
             and <a href="abstract-swift.property/index.html">
                <code>abstract</code>
            </a>
             is displayed together to give more context about this element and the element may be marked as deprecated based on the values of its  <a href="platforms/index.html">
                <code>platforms</code>
            </a>
             and other metadata about the current versions of the platforms.</p>
    </li>
</ul>
<p>The summary may include content that vary based on the source language. The content that is different in another source language is specified in a <a href="variant/index.html">
        <code>LinkDestinationSummary.Variant</code>
    </a>
    . Any property on the variant that is <code>nil</code>
     has the same value as the summarized element’s value.</p>
