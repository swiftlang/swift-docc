    <p>Structure</p>
    <h1>LinkDestinationSummary.Variant</h1>
    <p>A variant of content for a summarized element.</p>
    <pre>
        <code>struct Variant</code>
    </pre>
</section>
<h2>Overview</h2>
<blockquote class="aside note">
    <p class="label">Note</p>
    <p>All properties except for <a href="traits/index.html">
            <code>traits</code>
        </a>
         are optional. If a property is <code>nil</code>
         it means that the value is the same as the summarized element’s value.</p>
</blockquote>
<h2>Topics</h2>
<h3>Initializers</h3>
<ul>
    <li>
        <a href="init(traits:kind:language:relativepresentationurl:title:abstract:usr:plaintextdeclaration:subheadingdeclarationfragments:navigatordeclarationfragments:)/index.html">
            <code>init(traits: [RenderNode.Variant.Trait], kind: VariantValue&lt;DocumentationNode.Kind&gt;, language: VariantValue&lt;SourceLanguage&gt;, relativePresentationURL: VariantValue&lt;URL&gt;, title: VariantValue&lt;String&gt;, abstract: VariantValue&lt;LinkDestinationSummary.Abstract?&gt;, usr: VariantValue&lt;String?&gt;, plainTextDeclaration: VariantValue&lt;String?&gt;, subheadingDeclarationFragments: VariantValue&lt;LinkDestinationSummary.DeclarationFragments?&gt;, navigatorDeclarationFragments: VariantValue&lt;LinkDestinationSummary.DeclarationFragments?&gt;)</code>
        </a>
        <p>Creates a new summary variant with the values that are different from the main summarized values.</p>
    </li>
</ul>
<h3>Instance Properties</h3>
<ul>
    <li>
        <a href="abstract/index.html">
            <code>let abstract: VariantValue&lt;Abstract?&gt;</code>
        </a>
        <p>The abstract of the variant or <code>nil</code>
             if the abstract is the same as the summarized element.</p>
    </li>
    <li>
        <a href="kind/index.html">
            <code>let kind: VariantValue&lt;DocumentationNode.Kind&gt;</code>
        </a>
        <p>The kind of the variant or <code>nil</code>
             if the kind is the same as the summarized element.</p>
    </li>
    <li>
        <a href="language/index.html">
            <code>let language: VariantValue&lt;SourceLanguage&gt;</code>
        </a>
        <p>The source language of the variant or <code>nil</code>
             if the kind is the same as the summarized element.</p>
    </li>
    <li>
        <a href="navigatordeclarationfragments/index.html">
            <code>let navigatorDeclarationFragments: VariantValue&lt;DeclarationFragments?&gt;</code>
        </a>
        <p>The simplified “navigator” declaration fragments for this symbol,  or <code>nil</code>
             if the navigator title is the same as the summarized element.</p>
    </li>
    <li>
        <a href="plaintextdeclaration/index.html">
            <code>let plainTextDeclaration: VariantValue&lt;String?&gt;</code>
        </a>
        <p>The plain text declaration of this symbol, derived from its full declaration fragments, or <code>nil</code>
             if the precise symbol identifier is the same as the summarized element.</p>
    </li>
    <li>
        <a href="relativepresentationurl/index.html">
            <code>let relativePresentationURL: VariantValue&lt;URL&gt;</code>
        </a>
        <p>The relative presentation URL of the variant or <code>nil</code>
             if the relative is the same as the summarized element.</p>
    </li>
    <li>
        <a href="subheadingdeclarationfragments/index.html">
            <code>let subheadingDeclarationFragments: VariantValue&lt;DeclarationFragments?&gt;</code>
        </a>
        <p>The simplified “subheading” declaration fragments for this symbol, or <code>nil</code>
             if the declaration is the same as the summarized element.</p>
    </li>
    <li>
        <a href="title/index.html">
            <code>let title: VariantValue&lt;String&gt;</code>
        </a>
        <p>The title of the variant or <code>nil</code>
             if the title is the same as the summarized element.</p>
    </li>
    <li>
        <a href="traits/index.html">
            <code>let traits: [RenderNode.Variant.Trait]</code>
        </a>
        <p>The traits of the variant.</p>
    </li>
    <li>
        <a href="usr/index.html">
            <code>let usr: VariantValue&lt;String?&gt;</code>
        </a>
        <p>The precise symbol identifier of the variant or <code>nil</code>
             if the precise symbol identifier is the same as the summarized element.</p>
    </li>
</ul>
<h3>Type Aliases</h3>
<ul>
    <li>
        <a href="variantvalue/index.html">
            <code>typealias VariantValue</code>
        </a>
        <p>A wrapper for variant values that can either be specified, meaning the variant has a custom value, or not, meaning the variant has the same value as the summarized element.</p>
    </li>
</ul>
