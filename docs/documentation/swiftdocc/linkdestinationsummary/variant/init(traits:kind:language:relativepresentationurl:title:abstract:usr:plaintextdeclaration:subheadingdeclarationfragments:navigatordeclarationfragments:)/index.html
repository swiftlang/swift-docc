    <p>Initializer</p>
    <h1>init(traits:kind:language:relativePresentationURL:title:abstract:usr:plainTextDeclaration:subheadingDeclarationFragments:navigatorDeclarationFragments:)</h1>
    <p>Creates a new summary variant with the values that are different from the main summarized values.</p>
    <pre>
        <code>init(traits: [RenderNode.Variant.Trait], kind: VariantValue&lt;DocumentationNode.Kind&gt; = nil, language: VariantValue&lt;SourceLanguage&gt; = nil, relativePresentationURL: VariantValue&lt;URL&gt; = nil, title: VariantValue&lt;String&gt; = nil, abstract: VariantValue&lt;LinkDestinationSummary.Abstract?&gt; = nil, usr: VariantValue&lt;String?&gt; = nil, plainTextDeclaration: VariantValue&lt;String?&gt; = nil, subheadingDeclarationFragments: VariantValue&lt;LinkDestinationSummary.DeclarationFragments?&gt; = nil, navigatorDeclarationFragments: VariantValue&lt;LinkDestinationSummary.DeclarationFragments?&gt; = nil)</code>
    </pre>
</section>
<h2>Parameters</h2>
<dl>
    <dt>traits</dt>
    <dd>
        <p>The traits of the variant.</p>
    </dd>
    <dt>kind</dt>
    <dd>
        <p>The kind of the variant or <code>nil</code>
             if the kind is the same as the summarized element.</p>
    </dd>
    <dt>language</dt>
    <dd>
        <p>The source language of the variant or <code>nil</code>
             if the kind is the same as the summarized element.</p>
    </dd>
    <dt>relativePresentationURL</dt>
    <dd>
        <p>The relative presentation URL of the variant or <code>nil</code>
             if the relative is the same as the summarized element.</p>
    </dd>
    <dt>title</dt>
    <dd>
        <p>The title of the variant or <code>nil</code>
             if the title is the same as the summarized element.</p>
    </dd>
    <dt>abstract</dt>
    <dd>
        <p>The abstract of the variant or <code>nil</code>
             if the abstract is the same as the summarized element.</p>
    </dd>
    <dt>usr</dt>
    <dd>
        <p>The precise symbol identifier of the variant or <code>nil</code>
             if the precise symbol identifier is the same as the summarized element.</p>
    </dd>
    <dt>plainTextDeclaration</dt>
    <dd>
        <p>The plain text declaration of this symbol, derived from its full declaration fragments, or <code>nil</code>
             if the precise symbol identifier is the same as the summarized element.</p>
    </dd>
    <dt>subheadingDeclarationFragments</dt>
    <dd>
        <p>The simplified “subheading” declaration fragments for this symbol, to display in topic groups, or <code>nil</code>
             if the declaration is the same as the summarized element.</p>
    </dd>
    <dt>navigatorDeclarationFragments</dt>
    <dd>
        <p>The simplified “navigator” declaration fragments for this symbol, to display in navigation, or <code>nil</code>
             if the declaration is the same as the summarized element.</p>
    </dd>
</dl>
