    <hgroup>
      <p>Instance Property</p>
      <h1>navigatorTitle</h1>
    </hgroup>
    <p>
      The simplified “navigator” title of this symbol, derived from a simplification of its declaration fragments and joined together, or <code>nil</code> if the navigator title is the same as the summarized element.
    </p>
    <pre><code>let navigatorTitle: VariantValue&lt;String?></code></pre>
  </section>
  <h2>Discussion</h2>
  <p>This text is suitable to use to refer to a symbol when it’s displayed in a navigator.</p>
  <p>
    If the summarized element has a navigator title but the variant doesn’t, this property will be <code>Optional.some(nil)</code>.
  </p>
