      <li>init(kind:language:relativePresentationURL:referenceIdentifier:title:abstract:availableLanguages:platforms:usr:plainTextDeclaration:subheadingDeclarationFragments:navigatorDeclarationFragments:redirects:topicImages:references:variants:)</li>
    </ul>
    <hgroup>
      <p>Initializer</p>
      <h1>init(kind:language:relativePresentationURL:referenceIdentifier:title:abstract:availableLanguages:platforms:usr:plainTextDeclaration:subheadingDeclarationFragments:navigatorDeclarationFragments:redirects:topicImages:references:variants:)</h1>
    </hgroup>
    <p>Creates a new summary of an element that can be linked to from outside the local documentation.</p>
    <pre><code>init(kind: DocumentationNode.Kind, language: SourceLanguage, relativePresentationURL: URL, referenceIdentifier: RenderReferenceIdentifier, title: String, abstract: LinkDestinationSummary.Abstract? = nil, availableLanguages: Set&lt;SourceLanguage>, platforms: [LinkDestinationSummary.PlatformAvailability]? = nil, usr: String? = nil, plainTextDeclaration: String? = nil, subheadingDeclarationFragments: LinkDestinationSummary.DeclarationFragments? = nil, navigatorDeclarationFragments: LinkDestinationSummary.DeclarationFragments? = nil, redirects: [URL]? = nil, topicImages: [TopicImage]? = nil, references: [any RenderReference]? = nil, variants: [LinkDestinationSummary.Variant])</code></pre>
  </section>
  <h2>Parameters</h2>
  <dl>
    <dt>kind</dt>
    <dd>
      <p>The kind of the summarized element.</p>
    </dd>
    <dt>language</dt>
    <dd>
      <p>The language of the summarized element.</p>
    </dd>
    <dt>relativePresentationURL</dt>
    <dd>
      <p>The relative presentation URL for this element.</p>
    </dd>
    <dt>referenceIdentifier</dt>
    <dd>
      <p>The resolved reference identifier for this element.</p>
    </dd>
    <dt>title</dt>
    <dd>
      <p>The title of the summarized element.</p>
    </dd>
    <dt>abstract</dt>
    <dd>
      <p>The abstract of the summarized element.</p>
    </dd>
    <dt>availableLanguages</dt>
    <dd>
      <p>All the languages in which the summarized element is available.</p>
    </dd>
    <dt>platforms</dt>
    <dd>
      <p>Information about the platforms for which the summarized element is available.</p>
    </dd>
    <dt>usr</dt>
    <dd>
      <p>
        The unique, precise identifier for this symbol that you use to reference it across different systems, or <code>nil</code> if the summarized element isn’t a symbol.
      </p>
    </dd>
    <dt>plainTextDeclaration</dt>
    <dd>
      <p>
        The plain text declaration of this symbol, derived from its full declaration fragments, or <code>nil</code> if the summarized element isn’t a symbol.
      </p>
    </dd>
    <dt>subheadingDeclarationFragments</dt>
    <dd>
      <p>
        The simplified “subheading” fragments for this symbol, to display in topic groups, or <code>nil</code> if the summarized element isn’t a symbol.
      </p>
    </dd>
    <dt>navigatorDeclarationFragments</dt>
    <dd>
      <p>
        The simplified “subheading” declaration fragments for this symbol, to display in navigation, or <code>nil</code> if the summarized element isn’t a symbol.
      </p>
    </dd>
    <dt>redirects</dt>
    <dd>
      <p>
        Any previous URLs for this element, or <code>nil</code> if this element has no previous URLs.
      </p>
    </dd>
    <dt>topicImages</dt>
    <dd>
      <p>
        Images that are used to represent the summarized element, or <code>nil</code> if this element has no topic images.
      </p>
    </dd>
    <dt>references</dt>
    <dd>
      <p>
        References used in the content of the summarized element, or <code>nil</code> if this element has no references to other content.
      </p>
    </dd>
    <dt>variants</dt>
    <dd>
      <p>The variants of content (kind, title, abstract, path, urs, declaration, and task groups) for this summarized element.</p>
    </dd>
  </dl>
