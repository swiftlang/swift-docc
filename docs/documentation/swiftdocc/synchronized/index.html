    <p>Class</p>
    <h1>Synchronized</h1>
    <p>A wrapper type that ensures a synchronous access to a value.</p>
    <pre>
        <code>class Synchronized&lt;Value&gt;</code>
    </pre>
</section>
<h2>Overview</h2>
<p>To guarantee safe concurrent access to a value wrap it in a <code>Synchronized</code>
     type.</p>
<pre class="swift">
    <code>let index = Synchronized([String: String]())

// Mutate the value
index.sync { $0["key"] = "value" }
// Access the value
let value = index.sync { $0["key"] }
</code>
</pre>
