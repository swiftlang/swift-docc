    <hgroup>
      <p>Instance Method</p>
      <h1>sync(_:)</h1>
    </hgroup>
    <p>Performs a given block of code while synchronizing over the type’s stored value.</p>
    <pre><code>@discardableResult func sync&lt;Result, Error>(_ block: (inout Value) throws(Error) -> Result) throws(Error) -> Result where Error : Error</code></pre>
  </section>
  <h2>Parameters</h2>
  <dl>
    <dt>block</dt>
    <dd>
      <p>A throwing block of work that optionally returns a value.</p>
    </dd>
  </dl>
  <h2>Return Value</h2>
  <p>
    Returns the returned value of <code>block</code>, if any.
  </p>
