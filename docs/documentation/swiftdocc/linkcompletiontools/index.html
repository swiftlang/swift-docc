    <p>Enumeration</p>
    <h1>LinkCompletionTools</h1>
    <p>A collection of API for link completion.</p>
    <pre>
        <code>enum LinkCompletionTools</code>
    </pre>
</section>
<h2>Overview</h2>
<p>An example link completion workflow could look something like this; Assume that there’s already an partial link in progress: <code>First/Second-enum/</code>
</p>
<ul>
    <li>
        <p>First, parse the link into link components using <a href="parse(linkstring:)/index.html">
                <code>parse(linkString:)</code>
            </a>
            .</p>
    </li>
    <li>
        <p>Second, narrow down the possible symbols to suggest as completion using <a href="symbolinformation/matches(_:)/index.html">
                <code>matches(_:)</code>
            </a>
        </p>
    </li>
    <li>
        <p>Third, determine the minimal unique disambiguation for each completion suggestion using <a href="suggesteddisambiguation(forcollidingsymbols:)/index.html">
                <code>suggestedDisambiguation(forCollidingSymbols:)</code>
            </a>
        </p>
    </li>
</ul>
<blockquote class="aside tip">
    <p class="label">Tip</p>
    <p>You can use <a href="symbolinformation/hash(uniquesymbolid:)/index.html">
            <code>hash(uniqueSymbolID:)</code>
        </a>
         to compute the hashed symbol identifiers needed for steps 2 and 3 above.</p>
</blockquote>

<ul>

    </li>

        </a>
        <p>Suggests the minimal most readable disambiguation string for each symbol with the same name.</p>
    </li>
</ul>
